<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.0/examples/image-tracking/assets/card-example/card.mind;" embedded vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane position="0 0.1 0" scale="1 0.6 1" color="#000000" opacity="0.8"></a-plane>
            
            <a-text value="Samsung M32\nTechnical Status: OK" position="0 0.1 0.01" align="center" scale="0.5 0.5 0.5" color="#00e676"></a-text>
            
            <a-ring position="0 -0.2 0" radius-inner="0.1" radius-outer="0.15" color="#00e676" side="double"></a-ring>
        </a-entity>
    </a-scene>
</body>
</html>
