<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Maged Tech AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.0/examples/image-tracking/assets/card-example/card.mind;" 
             embedded 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        <a-entity mindar-image-target="targetIndex: 0">
            
            <a-plane position="0 0 0" 
                     scale="1 0.5 1" 
                     color="#000000" 
                     opacity="0.8">
            </a-plane>
            
            <a-text value="SAMSUNG M32\nMAJED TECH LAB\nSTATUS: ACTIVE" 
                    position="0 0 0.01" 
                    align="center" 
                    scale="0.4 0.4 0.4" 
                    color="#00e676">
            </a-text>
            
            <a-animation attribute="rotation" to="0 360 0" dur="10000" repeat="indefinite" easing="linear"></a-animation>
            
        </a-entity>
        
    </a-scene>
</body>
</html>
