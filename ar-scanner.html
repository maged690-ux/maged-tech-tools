<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>المجهر الرقمي | ماجد تك</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-three.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.0/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiLoading: no; uiError: no;" embedded>
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
       <a-entity mindar-image-target="targetIndex: 0">
    <a-plane src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Google_logo_dots_color_change.gif/240px-Google_logo_dots_color_change.gif" position="0 0 0" height="0.5" width="0.5" rotation="0 0 0"></a-plane>
</a-entity>
        
    </a-scene>

</body>
</html>
