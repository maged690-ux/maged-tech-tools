<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كابينة تصوير Maged Tech</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1a1a2e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #16213e; position: relative; }
        header { text-align: center; padding: 15px; background: rgba(15, 52, 96, 0.8); backdrop-filter: blur(10px); z-index: 10; position: relative; }
        .back-btn { position: absolute; right: 15px; top: 15px; color: #fff; text-decoration: none; font-size: 0.9rem; background: rgba(255, 255, 255, 0.1); padding: 5px 10px; border-radius: 8px; transition: 0.3s; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        header h1 { font-size: 1.5rem; color: #e94560; margin-bottom: 5px; margin-top: 20px; }
        header p { font-size: 0.9rem; color: #cccccc; }
        .camera-stage { flex-grow: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; }
        #loading-msg { position: absolute; color: #fff; font-size: 1.1rem; z-index: 5; text-align: center; padding: 20px; }
        #flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s ease-out; }
        .controls { background: rgba(22, 33, 62, 0.9); backdrop-filter: blur(15px); padding: 20px; border-top-left-radius: 25px; border-top-right-radius: 25px; position: absolute; bottom: 0; width: 100%; box-shadow: 0 -5px 20px rgba(0,0,0,0.4); z-index: 10; }
        .controls h3 { font-size: 1rem; margin-bottom: 10px; color: #e94560; }
        .characters-buttons, .backgrounds-buttons { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .characters-buttons::-webkit-scrollbar, .backgrounds-buttons::-webkit-scrollbar { display: none; }
        .char-btn, .bg-btn { background: #0f3460; color: #fff; border: 2px solid transparent; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; white-space: nowrap; }
        .char-btn:hover, .bg-btn:hover { background: #e94560; transform: translateY(-2px); }
        .active-btn { background: #e94560; border: 2px solid #fff; box-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }
        .main-btn { width: 100%; background: linear-gradient(45deg, #e94560, #ff2e63); color: white; border: none; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.5); transition: transform 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .main-btn:active { transform: scale(0.95); }
        .secondary-btn { background: linear-gradient(45deg, #0284c7, #38bdf8); box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5); }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> رجوع للمنصة</a>
            <h1>ماجيك كام 📸</h1>
            <p>صور مع شخصيات Maged Tech</p>
        </header>

        <div class="camera-stage">
            <div id="loading-msg">الكاميرا قيد التجهيز... ⏳</div>
            <video id="input_video" autoplay playsinline style="display: none;"></video>
            <canvas id="output_canvas"></canvas>
            <div id="flash-effect"></div>
        </div>

        <div class="controls">
            <h3>اختر رفيق الصورة:</h3>
            <div class="characters-buttons">
                <button id="btn-maged" class="char-btn active-btn" data-char="maged">أنا (المدير)</button>
                <button id="btn-mooney" class="char-btn" data-char="mooney">موني 🐵</button>
                <button id="btn-abboud" class="char-btn" data-char="abboud">عبود</button>
            </div>

            <h3>اختر الخلفية الخيالية:</h3>
            <div class="backgrounds-buttons">
                <button class="bg-btn active-btn" data-bg="neon">نيون استوديو</button>
                <button class="bg-btn" data-bg="cyber">ورشة سيبربانك</button>
                <button class="bg-btn" data-bg="matrix">ماتريكس</button>
            </div>

            <button id="capture-btn" class="main-btn">التقط الصورة السحرية ✨</button>
            <button id="download-btn" class="main-btn secondary-btn" style="display: none;"><i class="fa-solid fa-download"></i> حفظ الصورة</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingMsg = document.getElementById('loading-msg');
        
        let currentChar = 'maged';
        let currentBg = 'neon';

        // برمجة أزرار الشخصيات
        const charBtns = document.querySelectorAll('.char-btn');
        charBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                charBtns.forEach(b => b.classList.remove('active-btn'));
                e.target.classList.add('active-btn');
                currentChar = e.target.dataset.char;
            });
        });

        // برمجة أزرار الخلفيات
        const bgBtns = document.querySelectorAll('.bg-btn');
        bgBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                bgBtns.forEach(b => b.classList.remove('active-btn'));
                e.target.classList.add('active-btn');
                currentBg = e.target.dataset.bg;
            });
        });

        // دالة الرسم وعزل الخلفية (الذكاء الاصطناعي)
        function onResults(results) {
            loadingMsg.style.display = 'none';
            
            // تحديث أبعاد الكانفاس لتطابق أبعاد الكاميرا الحقيقية بدون تمطيط
            if (canvasElement.width !== results.image.width) {
                canvasElement.width = results.image.width;
                canvasElement.height = results.image.height;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. رسم قناع العزل (الماسك)
            canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);

            // 2. رسم صورة الشخص فقط داخل القناع
            canvasCtx.globalCompositeOperation = 'source-in';
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 3. رسم الخلفية الخيالية (تحت الشخص)
            canvasCtx.globalCompositeOperation = 'destination-over';
            if(currentBg === 'neon') {
                let grad = canvasCtx.createLinearGradient(0,0, 0, canvasElement.height);
                grad.addColorStop(0, "#833ab4"); grad.addColorStop(0.5, "#fd1d1d"); grad.addColorStop(1, "#fcb045");
                canvasCtx.fillStyle = grad;
            } else if (currentBg === 'cyber') {
                canvasCtx.fillStyle = '#0f3460';
            } else {
                canvasCtx.fillStyle = '#025023'; // ماتريكس أخضر
            }
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 4. رسم الشخصيات بأحجام متناسبة مع دقة الموبايل العالية
            canvasCtx.globalCompositeOperation = 'source-over';
            
            // حساب حجم الإيموجي نسبة لعرض الشاشة ليكون مناسب دائماً
            let emojiSize = Math.floor(canvasElement.width * 0.15); 
            canvasCtx.font = emojiSize + "px Arial";

            if(currentChar === 'maged') {
                canvasCtx.fillText("👨‍🦲", 50, emojiSize + 50);
            } else if(currentChar === 'mooney') {
                canvasCtx.fillText("🐵", canvasElement.width - emojiSize - 40, emojiSize + 50);
            } else {
                canvasCtx.fillText("🧑", 50, canvasElement.height - 150);
            }
            
            // ختم المنصة المائي متناسب مع دقة الشاشة
            let watermarkSize = Math.floor(canvasElement.width * 0.05);
            canvasCtx.font = "bold " + watermarkSize + "px Tahoma";
            canvasCtx.fillStyle = "rgba(255,255,255,0.7)";
            canvasCtx.fillText("Maged Tech 📸", 20, canvasElement.height - 40);

            canvasCtx.restore();
        }

        // إعداد مكتبة العزل
        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(onResults);

        // تشغيل الكاميرا الأمامية بأبعادها الطبيعية
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await selfieSegmentation.send({image: videoElement});
            },
            facingMode: 'user' // لضمان فتح كاميرا السيلفي
        });
        camera.start();

        // برمجة زر التقاط الصورة السحرية
        document.getElementById('capture-btn').addEventListener('click', () => {
            // ومضة الفلاش
            const flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 100);
            
            // حفظ الصورة
            const dataURL = canvasElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'Maged-Magic-Cam.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
