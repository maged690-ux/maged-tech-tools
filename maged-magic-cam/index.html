<script>
    // ... (نفس إعدادات الكاميرا السابقة)

    function onResults(results) {
        // ... (كود العزل والدمج نفس الشيء)

        // === التعديل الاحترافي هنا ===
        canvasCtx.globalCompositeOperation = 'source-over';
        
        // 1. فلتر الجمال التلقائي (دائماً شغال)
        if (currentFaceLandmarks) {
            // تنعيم خفيف جداً للجلد باستخدام فلتر إضاءة ناعمة
            canvasCtx.fillStyle = 'rgba(255, 230, 210, 0.08)'; 
            canvasCtx.globalCompositeOperation = 'soft-light';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.globalCompositeOperation = 'source-over';
        }

        // 2. الفلاتر التفاعلية المحدثة
        if (currentFilter !== 'none' && currentFaceLandmarks) {
            // ... (نفس منطق الحسابات السابق للميلان)
            
            // 🕶️ فلتر السايبربانك المطور (انسيابي)
            if (currentFilter === 'cyber') {
                canvasCtx.save();
                canvasCtx.translate(cx, cy);
                canvasCtx.rotate(angle);
                
                // شكل نظارة "انسيابي" بدل المربع
                canvasCtx.beginPath();
                canvasCtx.ellipse(0, 0, visorWidth/2, visorHeight/1.5, 0, 0, Math.PI * 2);
                canvasCtx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                canvasCtx.shadowColor = '#0ff';
                canvasCtx.shadowBlur = 30;
                canvasCtx.fill();
                canvasCtx.restore();
            }
            
            // 🌌 وشم الفضاء النبضي
            else if (currentFilter === 'paint') {
                const pulse = Math.abs(Math.sin(Date.now() * 0.005)); // تأثير النبض
                drawNeonLine(canvasCtx, currentFaceLandmarks, [103, 67, 10, 297, 332], `rgba(0,255,204,${0.5 + pulse*0.5})`, '#00ffcc');
                // ... (نفس باقي الخطوط)
            }
        }
        // ... (باقي الكود)
    }
</script>
