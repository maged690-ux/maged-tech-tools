<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maged Filter Cam Pro - Full</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; height: 100vh; overflow: hidden; color: #fff; }
        .camera-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .tabs { display: flex; gap: 20px; margin-bottom: 10px; }
        .tab { cursor: pointer; opacity: 0.6; }
        .tab.active { opacity: 1; border-bottom: 2px solid #fff; }
        .filter-carousel { display: flex; overflow-x: auto; gap: 10px; padding: 10px; width: 100%; }
        .filter-btn { flex: 0 0 auto; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; background-size: cover; cursor: pointer; }
        .active-btn { border: 4px solid #00ffff; }
        .capture-ring { width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="camera-stage">
        <video id="input_video" style="display:none;"></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
        <div class="tabs">
            <div class="tab active" onclick="showSection('sec-bg')">الخلفيات</div>
            <div class="tab" onclick="showSection('sec-filter')">الفلاتر</div>
        </div>
        
        <div id="sec-bg" class="filter-carousel"></div>
        
        <div id="sec-filter" class="filter-carousel" style="display:none;">
            <div class="filter-btn" onclick="currentFilter='beauty'">✨</div>
            <div class="filter-btn" onclick="currentFilter='cute'">🌸</div>
            <div class="filter-btn" onclick="currentFilter='cyber'">🕶️</div>
            <div class="filter-btn" onclick="currentFilter='paint'">🌌</div>
        </div>
        
        <div class="capture-ring" id="capture-btn"></div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const bgList = document.getElementById('sec-bg');
        
        const bgFiles = [
            'IMG-20260602-WA0011.jpg', 'IMG-20260602-WA0007.jpg', 'IMG-20260602-WA0008.jpg', 'IMG-20260602-WA0010.jpg',
            'bridge.jpg', 'homs.jpg', 'noria.jpg', 'umayyad.jpg',
            'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=300',
            'https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=300',
            'https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?w=300',
            'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=300',
            'https://images.unsplash.com/photo-1539667468225-eebb663053e6?w=300',
            'https://images.unsplash.com/photo-1534430480872-3498386e7856?w=300'
        ];

        let currentBgIndex = 0;
        let currentFilter = 'beauty';

        // إنشاء الأزرار
        bgFiles.forEach((file, index) => {
            const btn = document.createElement('div');
            btn.className = 'filter-btn' + (index === 0 ? ' active-btn' : '');
            btn.style.backgroundImage = `url('${file}')`;
            btn.onclick = (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-btn'));
                e.target.classList.add('active-btn');
                currentBgIndex = index;
            };
            bgList.appendChild(btn);
        });

        function showSection(id) {
            document.getElementById('sec-bg').style.display = id === 'sec-bg' ? 'flex' : 'none';
            document.getElementById('sec-filter').style.display = id === 'sec-filter' ? 'flex' : 'none';
        }

        // تشغيل الكاميرا ومعالجة الصور
        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await selfieSegmentation.send({image: videoElement});
            },
            width: 1280, height: 720
        });
        camera.start();

        // رسم الصورة (يجب ربطها مع MediaPipe)
        // ... (هنا يوضع كود الرسم الذي كان لديك)
    </script>
</body>
</html>
