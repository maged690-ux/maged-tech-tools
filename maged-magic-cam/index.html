<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maged Magic Cam</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* إعدادات سناب شات (شاشة كاملة وبدون حواف) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        
        /* حاوية التطبيق */
        .app-container { width: 100%; max-width: 480px; height: 100vh; position: relative; background: #111; overflow: hidden; }
        
        /* الكاميرا (خلفية كاملة) */
        .camera-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; }
        
        /* الهيدر الطايف الشفاف */
        header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #fff; text-decoration: none; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        header h1 { font-size: 1.2rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-weight: 600; margin: 0; }
        
        /* رسالة التحميل */
        #loading-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.2rem; z-index: 5; text-align: center; background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 30px; backdrop-filter: blur(5px); }
        
        /* الفلاش */
        #flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.15s ease-out; }
        
        /* واجهة التحكم السفلية (مثل سناب شات) */
        .controls { position: absolute; bottom: 0; left: 0; width: 100%; padding-bottom: 30px; z-index: 10; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, transparent 100%); display: flex; flex-direction: column; align-items: center; }
        
        /* شريط التمرير الدائري (العدسات/الفلاتر) */
        .filter-carousel { display: flex; overflow-x: auto; gap: 15px; padding: 15px 20px; width: 100%; scroll-snap-type: x mandatory; margin-bottom: 10px; }
        .filter-carousel::-webkit-scrollbar { display: none; }
        
        /* أزرار الفلاتر الدائرية */
        .filter-btn { width: 55px; height: 55px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; cursor: pointer; transition: all 0.3s; scroll-snap-align: center; color: white; position: relative; }
        .filter-btn:hover { background: rgba(255,255,255,0.3); }
        .active-btn { border-color: #e94560; transform: scale(1.15); background: rgba(233, 69, 96, 0.4); box-shadow: 0 0 15px rgba(233, 69, 96, 0.6); }
        
        /* تسميات الفلاتر */
        .filter-label { font-size: 0.8rem; text-shadow: 0 1px 3px rgba(0,0,0,0.8); margin-bottom: 5px; color: #ddd; font-weight: 600; }
        
        /* زر الالتقاط الضخم (Snapchat Style) */
        .capture-ring { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; margin-top: 10px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .capture-inner { width: 66px; height: 66px; border-radius: 50%; background: #fff; transition: all 0.2s; }
        .capture-ring:active .capture-inner { transform: scale(0.85); background: #f0f0f0; }
        
        /* تبويبات التبديل بين الشخصيات والخلفيات */
        .tabs { display: flex; gap: 20px; margin-bottom: 5px; }
        .tab { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: bold; cursor: pointer; padding-bottom: 5px; transition: 0.3s; }
        .tab.active-tab { color: #fff; border-bottom: 2px solid #fff; }
        
        .char-section, .bg-section { width: 100%; transition: 0.3s; }
        .bg-section { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <a href="../index.html" class="back-btn"><i class="fa-solid fa-xmark"></i></a>
            <h1>Maged Cam ✨</h1>
            <div style="width: 24px;"></div> </header>

        <div class="camera-stage">
            <div id="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> جاري تشغيل العدسة...</div>
            <video id="input_video" autoplay playsinline style="display: none;"></video>
            <canvas id="output_canvas"></canvas>
            <div id="flash-effect"></div>
        </div>

        <div class="controls">
            
            <div class="tabs">
                <div class="tab active-tab" id="tab-char" onclick="switchTab('char')">الشخصية</div>
                <div class="tab" id="tab-bg" onclick="switchTab('bg')">الخلفية</div>
            </div>

            <div class="char-section" id="sec-char">
                <div class="filter-carousel">
                    <div class="filter-btn char-btn active-btn" data-char="maged">👨‍🦲</div>
                    <div class="filter-btn char-btn" data-char="mooney">🐵</div>
                    <div class="filter-btn char-btn" data-char="abboud">🧑</div>
                </div>
            </div>

            <div class="bg-section" id="sec-bg">
                <div class="filter-carousel">
                    <div class="filter-btn bg-btn active-btn" data-bg="neon" style="background: linear-gradient(45deg, #833ab4, #fd1d1d);"></div>
                    <div class="filter-btn bg-btn" data-bg="cyber" style="background: #0f3460;"></div>
                    <div class="filter-btn bg-btn" data-bg="matrix" style="background: #025023;"></div>
                </div>
            </div>

            <div class="capture-ring" id="capture-btn">
                <div class="capture-inner"></div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingMsg = document.getElementById('loading-msg');
        
        let currentChar = 'maged';
        let currentBg = 'neon';

        // نظام التبويبات (Tabs)
        function switchTab(tabName) {
            document.getElementById('tab-char').classList.remove('active-tab');
            document.getElementById('tab-bg').classList.remove('active-tab');
            document.getElementById('sec-char').style.display = 'none';
            document.getElementById('sec-bg').style.display = 'none';
            
            document.getElementById('tab-' + tabName).classList.add('active-tab');
            document.getElementById('sec-' + tabName).style.display = 'block';
        }

        // برمجة أزرار الشخصيات
        const charBtns = document.querySelectorAll('.char-btn');
        charBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                charBtns.forEach(b => b.classList.remove('active-btn'));
                e.currentTarget.classList.add('active-btn');
                currentChar = e.currentTarget.dataset.char;
            });
        });

        // برمجة أزرار الخلفيات
        const bgBtns = document.querySelectorAll('.bg-btn');
        bgBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                bgBtns.forEach(b => b.classList.remove('active-btn'));
                e.currentTarget.classList.add('active-btn');
                currentBg = e.currentTarget.dataset.bg;
            });
        });

        // دالة الرسم (المحرك)
        function onResults(results) {
            loadingMsg.style.display = 'none';
            
            if (canvasElement.width !== results.image.width) {
                canvasElement.width = results.image.width;
                canvasElement.height = results.image.height;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. قناع العزل
            canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);

            // 2. الشخص
            canvasCtx.globalCompositeOperation = 'source-in';
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 3. الخلفية
            canvasCtx.globalCompositeOperation = 'destination-over';
            if(currentBg === 'neon') {
                let grad = canvasCtx.createLinearGradient(0,0, 0, canvasElement.height);
                grad.addColorStop(0, "#833ab4"); grad.addColorStop(0.5, "#fd1d1d"); grad.addColorStop(1, "#fcb045");
                canvasCtx.fillStyle = grad;
            } else if (currentBg === 'cyber') {
                canvasCtx.fillStyle = '#0f3460';
            } else {
                canvasCtx.fillStyle = '#025023';
            }
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 4. الشخصيات
            canvasCtx.globalCompositeOperation = 'source-over';
            let emojiSize = Math.floor(canvasElement.width * 0.15); 
            canvasCtx.font = emojiSize + "px Arial";

            if(currentChar === 'maged') {
                canvasCtx.fillText("👨‍🦲", 50, emojiSize + 50);
            } else if(currentChar === 'mooney') {
                canvasCtx.fillText("🐵", canvasElement.width - emojiSize - 40, emojiSize + 50);
            } else {
                canvasCtx.fillText("🧑", 50, canvasElement.height - 150);
            }
            
            // الختم
            let watermarkSize = Math.floor(canvasElement.width * 0.05);
            canvasCtx.font = "bold " + watermarkSize + "px Tahoma";
            canvasCtx.fillStyle = "rgba(255,255,255,0.7)";
            canvasCtx.shadowColor = "rgba(0,0,0,0.5)";
            canvasCtx.shadowBlur = 4;
            canvasCtx.fillText("Maged Tech 📸", 20, canvasElement.height - 40);

            canvasCtx.restore();
        }

        // إعداد الذكاء الاصطناعي
        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(onResults);

        // الكاميرا
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await selfieSegmentation.send({image: videoElement});
            },
            facingMode: 'user'
        });
        camera.start();

        // التقاط الصورة
        document.getElementById('capture-btn').addEventListener('click', () => {
            const flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 150);
            
            const dataURL = canvasElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'Maged-Snap.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
