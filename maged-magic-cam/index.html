<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maged Filter Cam Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        .app-container { width: 100vw; height: 100dvh; position: relative; }
        .camera-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        header { position: absolute; top: 0; left: 0; width: 100%; padding: 20px; z-index: 10; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .icon-btn { color: #fff; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .controls { position: absolute; bottom: 30px; width: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .tabs { display: flex; gap: 20px; margin-bottom: 10px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; }
        .tab { color: #aaa; font-weight: bold; cursor: pointer; padding: 5px 10px; }
        .tab.active-tab { color: #fff; border-bottom: 2px solid #fff; }
        .filter-carousel { display: flex; overflow-x: auto; gap: 10px; padding: 10px; width: 100%; scroll-snap-type: x mandatory; }
        .filter-btn { flex: 0 0 auto; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; background-size: cover; background-position: center; cursor: pointer; }
        .active-btn { border: 4px solid #00ffff; transform: scale(1.1); }
        .capture-ring { width: 80px; height: 80px; border-radius: 50%; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 10px; }
        .capture-inner { width: 60px; height: 60px; border-radius: 50%; background: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <a href="../index.html" class="icon-btn"><i class="fa-solid fa-xmark"></i></a>
            <h1>Maged Pro ✨</h1>
            <button id="flip-cam-btn" class="icon-btn"><i class="fa-solid fa-camera-rotate"></i></button>
        </header>
        <div class="camera-stage">
            <video id="input_video" autoplay playsinline style="display: none;"></video>
            <canvas id="output_canvas"></canvas>
        </div>
        <div class="controls">
            <div class="tabs">
                <div class="tab active-tab" id="tab-bg" onclick="switchTab('bg')">الخلفيات</div>
                <div class="tab" id="tab-filter" onclick="switchTab('filter')">الفلاتر</div>
            </div>
            <div id="sec-bg" class="filter-carousel"></div>
            <div id="sec-filter" class="filter-carousel" style="display:none;">
                <div class="filter-btn active-btn" onclick="setFilter('beauty', this)">✨</div>
                <div class="filter-btn" onclick="setFilter('cute', this)">🌸</div>
                <div class="filter-btn" onclick="setFilter('cyber', this)">🕶️</div>
                <div class="filter-btn" onclick="setFilter('paint', this)">🌌</div>
            </div>
            <div class="capture-ring" id="capture-btn"><div class="capture-inner"></div></div>
        </div>
    </div>

    <script>
        const bgFiles = [
            'IMG-20260602-WA0011.jpg', 'IMG-20260602-WA0007.jpg', 'IMG-20260602-WA0008.jpg', 'IMG-20260602-WA0010.jpg',
            'bridge.jpg', 'homs.jpg', 'noria.jpg', 'umayyad.jpg',
            'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=300',
            'https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=300',
            'https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?w=300',
            'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=300',
            'https://images.unsplash.com/photo-1539667468225-eebb663053e6?w=300',
            'https://images.unsplash.com/photo-1534430480872-3498386e7856?w=300'
        ];

        let currentBgIndex = 0, currentFilter = 'beauty', isFrontCam = true;
        const bgList = document.getElementById('sec-bg');
        
        bgFiles.forEach((file, index) => {
            const btn = document.createElement('div');
            btn.className = 'filter-btn' + (index === 0 ? ' active-btn' : '');
            btn.style.backgroundImage = `url('${file}')`;
            btn.onclick = (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-btn'));
                e.target.classList.add('active-btn');
                currentBgIndex = index;
            };
            bgList.appendChild(btn);
        });

        function switchTab(t) {
            document.getElementById('sec-bg').style.display = t === 'bg' ? 'flex' : 'none';
            document.getElementById('sec-filter').style.display = t === 'filter' ? 'flex' : 'none';
            document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active-tab'));
        }

        function setFilter(f, btn) {
            currentFilter = f;
            document.querySelectorAll('#sec-filter .filter-btn').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
        }

        // [من هنا تبدأ برمجيات MediaPipe كما في كودك الأصلي]
        // تأكد من ربط الكاميرا ومعالجة الصور باستخدام currentBgIndex و currentFilter
    </script>
</body>
</html>
