<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maged Magic Cam</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* إعدادات الشاشة الكاملة الصارمة */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        .app-container { width: 100vw; height: 100dvh; position: relative; }
        
        .camera-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #output_canvas { width: 100%; height: 100%; object-fit: cover; }
        
        header { position: absolute; top: 0; left: 0; width: 100%; padding: 25px 20px; z-index: 10; display: flex; justify-content: space-between; align-items: center; background: transparent; }
        .back-btn { color: #fff; text-decoration: none; font-size: 1.5rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        header h1 { font-size: 1.2rem; color: #fff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); margin: 0; letter-spacing: 1px; }
        
        #loading-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.1rem; z-index: 5; text-align: center; background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 30px; backdrop-filter: blur(5px); }
        #flash-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.15s ease-out; }
        
        .controls { position: absolute; bottom: 40px; left: 0; width: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; background: transparent; pointer-events: none; }
        .controls > * { pointer-events: auto; }
        
        .tabs { display: flex; gap: 30px; margin-bottom: 15px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8)); }
        .tab { font-size: 1rem; color: rgba(255,255,255,0.6); font-weight: bold; cursor: pointer; padding-bottom: 5px; transition: 0.3s; text-shadow: 0 2px 4px rgba(0,0,0,1); }
        .tab.active-tab { color: #fff; border-bottom: 2px solid #fff; }
        
        .char-section, .bg-section { width: 100%; }
        .bg-section { display: none; }
        
        .filter-carousel { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; width: 100%; justify-content: center; scroll-snap-type: x mandatory; margin-bottom: 20px; }
        .filter-carousel::-webkit-scrollbar { display: none; }
        
        .filter-btn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; font-size: 1.6rem; cursor: pointer; transition: all 0.2s; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .filter-btn.active-btn { border-color: #fff; transform: scale(1.15); border-width: 4px; background: rgba(255,255,255,0.2); }
        
        .capture-ring { width: 85px; height: 85px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: transform 0.1s; margin-top: 5px; }
        .capture-inner { width: 65px; height: 65px; border-radius: 50%; background: #fff; transition: all 0.1s; }
        .capture-ring:active .capture-inner { transform: scale(0.85); background: #e0e0e0; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <a href="../index.html" class="back-btn"><i class="fa-solid fa-xmark"></i></a>
            <h1>Maged Cam ✨</h1>
            <div style="width: 24px;"></div>
        </header>

        <div class="camera-stage">
            <div id="loading-msg"><i class="fa-solid fa-spinner fa-spin"></i> جاري التجهيز...</div>
            <video id="input_video" autoplay playsinline style="display: none;"></video>
            <canvas id="output_canvas"></canvas>
            <div id="flash-effect"></div>
        </div>

        <div class="controls">
            
            <div class="tabs">
                <div class="tab active-tab" id="tab-char" onclick="switchTab('char')">الرفيق</div>
                <div class="tab" id="tab-bg" onclick="switchTab('bg')">الخلفية</div>
            </div>

            <div class="char-section" id="sec-char">
                <div class="filter-carousel">
                    <div class="filter-btn char-btn active-btn" data-char="maged">👨‍🦲</div>
                    <div class="filter-btn char-btn" data-char="mooney">🐵</div>
                    <div class="filter-btn char-btn" data-char="abboud">🧑</div>
                </div>
            </div>

            <div class="bg-section" id="sec-bg">
                <div class="filter-carousel">
                    <div class="filter-btn bg-btn active-btn" data-bg="neon" style="background: linear-gradient(45deg, #833ab4, #fd1d1d);"></div>
                    <div class="filter-btn bg-btn" data-bg="cyber" style="background: #0f3460;"></div>
                    <div class="filter-btn bg-btn" data-bg="matrix" style="background: #025023;"></div>
                </div>
            </div>

            <div class="capture-ring" id="capture-btn">
                <div class="capture-inner"></div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingMsg = document.getElementById('loading-msg');
        
        let currentChar = 'maged';
        let currentBg = 'neon';

        // 1. تحميل صور الشخصيات الشفافة
        const charImages = {
            'maged': new Image(),
            'mooney': new Image(),
            'abboud': new Image()
        };
        charImages['maged'].src = 'maged.png';
        charImages['mooney'].src = 'mooney.png';
        charImages['abboud'].src = 'abboud.png';

        // نظام التبويبات
        function switchTab(tabName) {
            document.getElementById('tab-char').classList.remove('active-tab');
            document.getElementById('tab-bg').classList.remove('active-tab');
            document.getElementById('sec-char').style.display = 'none';
            document.getElementById('sec-bg').style.display = 'none';
            
            document.getElementById('tab-' + tabName).classList.add('active-tab');
            document.getElementById('sec-' + tabName).style.display = 'block';
        }

        // الأزرار
        const charBtns = document.querySelectorAll('.char-btn');
        charBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                charBtns.forEach(b => b.classList.remove('active-btn'));
                e.currentTarget.classList.add('active-btn');
                currentChar = e.currentTarget.dataset.char;
            });
        });

        const bgBtns = document.querySelectorAll('.bg-btn');
        bgBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                bgBtns.forEach(b => b.classList.remove('active-btn'));
                e.currentTarget.classList.add('active-btn');
                currentBg = e.currentTarget.dataset.bg;
            });
        });

        // محرك الرسم الذكي
        function onResults(results) {
            loadingMsg.style.display = 'none';
            
            if (canvasElement.width !== results.image.width) {
                canvasElement.width = results.image.width;
                canvasElement.height = results.image.height;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // القناع
            canvasCtx.drawImage(results.segmentationMask, 0, 0, canvasElement.width, canvasElement.height);

            // الشخص
            canvasCtx.globalCompositeOperation = 'source-in';
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // الخلفية
            canvasCtx.globalCompositeOperation = 'destination-over';
            if(currentBg === 'neon') {
                let grad = canvasCtx.createLinearGradient(0,0, 0, canvasElement.height);
                grad.addColorStop(0, "#833ab4"); grad.addColorStop(0.5, "#fd1d1d"); grad.addColorStop(1, "#fcb045");
                canvasCtx.fillStyle = grad;
            } else if (currentBg === 'cyber') {
                canvasCtx.fillStyle = '#0f3460';
            } else {
                canvasCtx.fillStyle = '#025023';
            }
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 4. رسم الشخصيات الاحترافية وتفريغ الخلفيات الزائدة برمجياً
            canvasCtx.globalCompositeOperation = 'source-over';
            
            if (charImages[currentChar].complete && charImages[currentChar].naturalWidth !== 0) {
                
                // حساب العرض والطول مع الحفاظ على الأبعاد الأصلية للصورة لمنع التمدد
                let charWidth = Math.floor(canvasElement.width * 0.45); 
                let imageRatio = charImages[currentChar].naturalHeight / charImages[currentChar].naturalWidth;
                let charHeight = Math.floor(charWidth * imageRatio);
                
                // === إضافة الانسيابية وحركة التنفس/الطوفان التلقائية ===
                const time = Date.now() * 0.0025; // سرعة الحركة والتأرجح
                const floatOffset = Math.sin(time) * 12; // مقدار الصعود والنزول (12 بيكسل)
                
                let baseYPos = canvasElement.height - charHeight - 20;
                let animatedYPos = baseYPos + floatOffset;
                
                // تحديد التموضع الأفقي بناءً على الشخصية المختارة
                let xPos = (currentChar === 'maged') ? 20 : canvasElement.width - charWidth - 20;

                // إنشاء Canvas مؤقت لمعالجة مصفوفة بكسلات الصورة وإزالة الخلفيات السادة
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = charWidth;
                tempCanvas.height = charHeight;
                const tempCtx = tempCanvas.getContext('2d');
                
                // رسم الصورة على الكانفاس المؤقت أولاً
                tempCtx.drawImage(charImages[currentChar], 0, 0, charWidth, charHeight);
                
                // تعديل قيم مصفوفة الـ RGBA للبكسلات
                const imgData = tempCtx.getImageData(0, 0, charWidth, charHeight);
                const data = imgData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];     
                    let g = data[i+1];   
                    let b = data[i+2];   
                    
                    // الكشف عن بكسلات الخلفية البيضاء (المرتبطة بتطبيق القص الحالي) أو السوداء
                    const isWhite = (r > 235 && g > 235 && b > 235);
                    const isBlack = (r < 35 && g < 35 && b < 35);
                    
                    if (isWhite || isBlack) {
                        data[i + 3] = 0; // تعديل قيمة الشفافية لتصبح مخفية تماماً
                    }
                }
                
                // حقن البيانات المنقاة مجدداً داخل الكانفاس المؤقت
                tempCtx.putImageData(imgData, 0, 0);

                // إخراج الصورة النهائية المفرغة مع تطبيق التأثير الانسيابي على الشاشة
                canvasCtx.drawImage(tempCanvas, xPos, animatedYPos);
            }
            
            // الختم
            let watermarkSize = Math.floor(canvasElement.width * 0.05);
            canvasCtx.font = "bold " + watermarkSize + "px Tahoma";
            canvasCtx.fillStyle = "rgba(255,255,255,0.8)";
            canvasCtx.shadowColor = "rgba(0,0,0,0.8)";
            canvasCtx.shadowBlur = 5;
            canvasCtx.fillText("Maged Tech 📸", 20, canvasElement.height - 40);

            canvasCtx.restore();
        }

        // إعداد الذكاء الاصطناعي
        const selfieSegmentation = new SelfieSegmentation({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }});
        selfieSegmentation.setOptions({ modelSelection: 1 });
        selfieSegmentation.onResults(onResults);

        // تشغيل الكاميرا
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await selfieSegmentation.send({image: videoElement});
            },
            facingMode: 'user'
        });
        camera.start();

        // التقاط الصورة
        document.getElementById('capture-btn').addEventListener('click', () => {
            const flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 150);
            
            const dataURL = canvasElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'Maged-Snap.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
