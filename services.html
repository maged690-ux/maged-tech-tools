<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات Maged Tech السحرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #05050a; color: #fff; padding: 20px; text-align: center; overflow-x: hidden; }
        .container { max-width: 600px; margin: auto; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; border: 1px solid rgba(0, 242, 255, 0.3); }
        h1 { color: #00f2ff; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); font-size: 1.8rem; }
        p.subtitle { margin-bottom: 25px; opacity: 0.8; }
        
        input { width: 100%; padding: 15px; margin-bottom: 20px; background: #111; border: 1px solid #333; color: #fff; border-radius: 12px; font-family: 'Tajawal'; font-size: 1rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #00f2ff; box-shadow: 0 0 10px rgba(0,242,255,0.3); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .btn-tool { position: relative; background: rgba(0,0,0,0.5); border: 2px solid; padding: 20px 10px; border-radius: 15px; cursor: pointer; color: #fff; font-weight: bold; font-family: 'Tajawal'; font-size: 1rem; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-tool:hover { transform: scale(1.03); }
        
        .btn-1 { border-color: #ff0055; } .btn-1:hover { background: #ff0055; }
        .btn-2 { border-color: #00f2ff; } .btn-2:hover { background: #00f2ff; color: #000; }
        .btn-3 { border-color: #ffaa00; } .btn-3:hover { background: #ffaa00; color: #000; }
        .btn-4 { border-color: #aa00ff; } .btn-4:hover { background: #aa00ff; }
        
        /* أيقونة المعلومات (الفقاعة) */
        .info-icon { position: absolute; top: 10px; left: 10px; font-size: 1.2rem; color: rgba(255,255,255,0.4); padding: 5px; border-radius: 50%; transition: 0.3s; z-index: 2; }
        .info-icon:hover, .info-icon:active { color: #00f2ff; background: rgba(0,242,255,0.1); transform: scale(1.1); }
        
        /* تصميم الفقاعة العائمة */
        #info-bubble { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 25, 0.95); backdrop-filter: blur(10px); border: 1px solid #00f2ff; color: #fff; padding: 15px 20px; border-radius: 15px; z-index: 1000; font-size: 1rem; box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3); display: none; width: 85%; max-width: 350px; text-align: center; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popUp { 0% { transform: translate(-50%, 30px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }

        #result-box { display: none; background: #1a1a24; padding: 20px; border-radius: 15px; text-align: right; margin-top: 20px; border: 1px dashed #00f2ff; }
        .subscribe-btn { display: block; background: #ff0000; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; margin-top: 20px; font-weight: bold; text-align: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h1>أدوات Maged Tech السريعة 🚀</h1>
    <p class="subtitle">أنجز أعمالك بكبسة زر عبر الذكاء الاصطناعي</p>

    <input type="text" id="userInput" placeholder="اكتب طلبك هنا (مثال: اسم طفل، فكرة بوست)...">

    <div class="grid">
        <button class="btn-tool btn-1" onclick="callAI('post')">
            <span class="info-icon" onclick="showInfo(event, 'يكتب لك منشورات تسويقية احترافية لصفحاتك على السوشيال ميديا مع هاشتاجات وإيموجي مناسبة.')">
                <i class="fa-solid fa-circle-info"></i>
            </span>
            <i class="fa-solid fa-pen" style="font-size: 2rem; margin-bottom: 10px;"></i>
            كاتب البوستات
        </button>
        
        <button class="btn-tool btn-2" onclick="callAI('email')">
            <span class="info-icon" onclick="showInfo(event, 'يقوم بتحويل كلامك العامي أو الفكرة البسيطة إلى رسالة رسمية أو إيميل احترافي جاهز للإرسال.')">
                <i class="fa-solid fa-circle-info"></i>
            </span>
            <i class="fa-solid fa-envelope" style="font-size: 2rem; margin-bottom: 10px;"></i>
            رسالة رسمية
        </button>
        
        <button class="btn-tool btn-3" onclick="callAI('moni')">
            <span class="info-icon" onclick="showInfo(event, 'يؤلف قصة قصيرة ممتعة للأطفال بطلها المساعد التقني موني، وتتضمن نصيحة تكنولوجية لطيفة.')">
                <i class="fa-solid fa-circle-info"></i>
            </span>
            <i class="fa-solid fa-book" style="font-size: 2rem; margin-bottom: 10px;"></i>
            قصة من موني 🐒
        </button>
        
        <button class="btn-tool btn-4" onclick="callAI('abboud')">
            <span class="info-icon" onclick="showInfo(event, 'يولد لك نكتة مضحكة جداً أو فكرة مقلب طريف من عالم شخصية عبود الكوميدية.')">
                <i class="fa-solid fa-circle-info"></i>
            </span>
            <i class="fa-solid fa-face-laugh-squint" style="font-size: 2rem; margin-bottom: 10px;"></i>
            نكت عبود 🎭
        </button>
    </div>

    <div id="loading" style="display:none; color: #00f2ff; margin-top: 15px; font-weight: bold;">
        <i class="fa-solid fa-spinner fa-spin"></i> جاري التحضير...
    </div>

    <!-- الفقاعة العائمة للشرح -->
    <div id="info-bubble"></div>

    <div id="result-box">
        <div id="ai-response" style="white-space: pre-line; line-height: 1.8; font-size: 1.1rem;"></div>
        <a href="https://youtube.com/@magedtech" target="_blank" class="subscribe-btn">
            <i class="fa-brands fa-youtube"></i> ادعمنا باشتراك لتبقى الخدمة مجانية!
        </a>
    </div>
</div>

<script>
let bubbleTimeout;

// دالة عرض الفقاعة العائمة
function showInfo(event, text) {
    event.stopPropagation(); // يمنع تشغيل طلب الذكاء الاصطناعي عند ضغط زر الشرح
    const bubble = document.getElementById('info-bubble');
    bubble.innerHTML = `<i class="fa-solid fa-circle-info" style="color: #00f2ff; font-size: 1.5rem; margin-bottom: 10px;"></i><br>${text}`;
    bubble.style.display = 'block';

    clearTimeout(bubbleTimeout);
    bubbleTimeout = setTimeout(() => {
        bubble.style.display = 'none';
    }, 4500); // تختفي الفقاعة تلقائياً بعد 4.5 ثواني
}

// دالة الاتصال بالذكاء الاصطناعي
async function callAI(type) {
    const input = document.getElementById('userInput').value;
    if (!input) { 
        alert("يرجى كتابة طلبك في المربع أولاً!"); 
        return; 
    }

    document.getElementById('loading').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';

    let systemPrompt = "";
    if (type === 'post') systemPrompt = "أنت مسوق إلكتروني محترف. اكتب بوست جذاب للسوشيال ميديا عن الموضوع التالي مع إيموجي وهاشتاجات: " + input;
    if (type === 'email') systemPrompt = "أنت مساعد إداري. حول هذا الكلام العامي إلى رسالة رسمية أو إيميل احترافي منسق: " + input;
    if (type === 'moni') systemPrompt = "أنت قرد شمبانزي مرح وذكي اسمك 'موني' وتعمل كمساعد تقني في منصة Maged Tech. اكتب قصة قصيرة طريفة قبل النوم للطفل المذكور اسمه، تتضمن نصيحة تكنولوجية مبسطة: " + input;
    if (type === 'abboud') systemPrompt = "أنت شخصية خيالية كوميدية اسمك 'عبود' تعمل مع ماجد. أعطني نكتة مضحكة جداً أو فكرة مقلب طريف تتعلق بهذا الموضوع: " + input;

    const requestBody = {
        contents: [{ parts: [{ text: systemPrompt + "\n\n(في نهاية النص دائماً أضف هذه الجملة حرفياً: ✨ تم التوليد عبر منصة Maged Tech)" }] }]
    };

    try {
        const response = await fetch('https://maged-tech-tools.vercel.app/api/gemini', {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
        });
        const data = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('ai-response').innerText = data.candidates[0].content.parts[0].text;
        document.getElementById('result-box').style.display = 'block';
    } catch (e) {
        document.getElementById('loading').style.display = 'none';
        alert("حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة مرة أخرى!");
    }
}
</script>

</body>
</html>
