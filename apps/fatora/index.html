<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة ماجد تك - النظام الاحترافي</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0b0f19; --card: #151f32; --text: #f8fafc; --green: #10b981; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 450px; margin: auto; background: var(--card); padding: 20px; border-radius: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #22314d; background: #0b0f19; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-m { background: var(--primary); color: #0b0f19; }
        .btn-c { background: var(--green); color: white; }
        .hidden { display: none; }
        .result-box { padding: 15px; background: #0b0f19; border-radius: 10px; margin-top: 10px; border-right: 4px solid var(--primary); }
    </style>
</head>
<body>

<div class="container" id="menu">
    <h3 style="text-align:center;">إدارة ماجد تك للصيانة</h3>
    <button class="btn btn-m" onclick="show('mgr')">💼 لوحة المدير</button>
    <button class="btn btn-c" onclick="show('cust')">🕵️ تتبع الغرض</button>
</div>

<div class="container hidden" id="mgr">
    <h3>إصدار / تحديث إيصال</h3>
    <input type="text" id="m-id" placeholder="رقم الفاتورة">
    <input type="text" id="m-item" placeholder="اسم المادة">
    <input type="text" id="m-phone" placeholder="رقم واتساب الزبون (مثال: 9639xxxxxx)">
    <select id="m-status">
        <option value="تم الاستلام">تم الاستلام 📥</option>
        <option value="قيد الإصلاح">قيد الإصلاح 🛠️</option>
        <option value="بانتظار قطعة غيار">بانتظار قطعة غيار ⚙️</option>
        <option value="جاهز للتسليم">جاهز للتسليم ✅</option>
    </select>
    <button class="btn btn-m" onclick="save()">حفظ البيانات</button>
    <button class="btn btn-c" onclick="sendToCustomer()">إرسال إشعار للزبون</button>
    <button class="btn" onclick="location.reload()">رجوع</button>
</div>

<div class="container hidden" id="cust">
    <h3>استعلام عن الحالة</h3>
    <input type="text" id="c-search" placeholder="رقم الفاتورة أو اسم المادة">
    <button class="btn btn-c" onclick="track()">بحث</button>
    <div id="res" class="result-box hidden"></div>
    <button class="btn" onclick="location.reload()">رجوع</button>
</div>

<script>
    function show(p) { document.getElementById('menu').classList.add('hidden'); document.getElementById(p).classList.remove('hidden'); }

    function save() {
        let id = document.getElementById('m-id').value;
        let data = { item: document.getElementById('m-item').value, status: document.getElementById('m-status').value, phone: document.getElementById('m-phone').value };
        localStorage.setItem('rec_' + id, JSON.stringify(data));
        localStorage.setItem('name_' + data.item.toLowerCase(), id);
        alert("تم حفظ الفاتورة بنجاح!");
    }

    function sendToCustomer() {
        let id = document.getElementById('m-id').value;
        let phone = document.getElementById('m-phone').value;
        let item = document.getElementById('m-item').value;
        let status = document.getElementById('m-status').value;
        
        let msg = `مرحباً! بخصوص طلبك (${item}) - رقم الفاتورة (${id}): الحالة الآن هي "${status}". نرجو منك متابعة الحالة أو مراجعتنا لاستلام الغرض إذا كان جاهزاً. شكراً لتعاملك مع ماجد تك!`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function track() {
        let q = document.getElementById('c-search').value.toLowerCase();
        let id = localStorage.getItem('rec_' + q) ? q : localStorage.getItem('name_' + q);
        let d = JSON.parse(localStorage.getItem('rec_' + id));
        if(d) {
            document.getElementById('res').innerHTML = `المادة: ${d.item}<br>الحالة: <b>${d.status}</b>`;
            document.getElementById('res').classList.remove('hidden');
        } else {
            alert("لا يوجد غرض بهذا الاسم أو الرقم");
        }
    }
</script>
</body>
</html>
