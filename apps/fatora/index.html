<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة ماجد تك - النظام الشامل</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0b0f19; --card: #151f32; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 20px; border-radius: 20px; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .btn-m { background: var(--primary); }
        .btn-c { background: #10b981; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #22314d; background: #0b0f19; color: white; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h2 style="text-align:center;">مرحباً بك في ماجد تك</h2>
    <button class="btn btn-m" onclick="showPanel('panel-manager')">💼 أنا صاحب الورشة (إدارة)</button>
    <button class="btn btn-c" onclick="showPanel('panel-customer')">🕵️ أنا زبون (تتبع فاتورة)</button>
</div>

<div class="container hidden" id="panel-customer">
    <h3>تتبع طلبك</h3>
    <input type="text" id="track-id" placeholder="أدخل رقم الإيصال">
    <button class="btn btn-c" onclick="trackReceipt()">بحث</button>
    <div id="result"></div>
    <button class="btn" onclick="location.reload()">رجوع للقائمة</button>
</div>

<div class="container hidden" id="panel-manager">
    <h3>لوحة الإدارة</h3>
    <input type="text" id="m-id" placeholder="رقم الإيصال">
    <input type="text" id="m-name" placeholder="اسم الجهاز">
    <input type="text" id="m-status" placeholder="الحالة (مثال: جاهز)">
    <button class="btn btn-m" onclick="saveReceipt()">حفظ الفاتورة</button>
    <div id="receipt-list"></div>
    <button class="btn" onclick="location.reload()">رجوع للقائمة</button>
</div>

<script>
    function showPanel(id) {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
        if(id === 'panel-manager') renderList();
    }

    function saveReceipt() {
        let id = document.getElementById('m-id').value;
        let data = { name: document.getElementById('m-name').value, status: document.getElementById('m-status').value };
        localStorage.setItem('rec_' + id, JSON.stringify(data));
        alert("تم الحفظ!");
        renderList();
    }

    function trackReceipt() {
        let id = document.getElementById('track-id').value;
        let data = JSON.parse(localStorage.getItem('rec_' + id));
        document.getElementById('result').innerHTML = data ? `الجهاز: ${data.name} <br> الحالة: ${data.status}` : "غير موجود";
    }

    function renderList() {
        let html = "<h4>السجلات الحالية:</h4>";
        for(let i=0; i<localStorage.length; i++) {
            let key = localStorage.key(i);
            if(key.startsWith('rec_')) {
                let val = JSON.parse(localStorage.getItem(key));
                html += `<p>${key.replace('rec_','')} | ${val.name} | ${val.status}</p>`;
            }
        }
        document.getElementById('receipt-list').innerHTML = html;
    }
</script>

</body>
</html>
