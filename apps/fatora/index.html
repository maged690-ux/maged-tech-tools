<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة ماجد تك - الرقمية</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #f8fafc; padding: 20px; }
        .card { background: #151f32; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; }
        input { width: 100%; padding: 15px; margin: 8px 0; border-radius: 10px; border: 1px solid #22314d; background: #0b0f19; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 10px; background: #38bdf8; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #0b0f19; }
        .list-item { background: #1e293b; padding: 15px; margin-top: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid #38bdf8; }
        .delete-btn { color: #ef4444; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="card">
    <h2>فاتورة رقمية</h2>
    <input type="text" id="name" placeholder="اسم الزبون / الغرض">
    <input type="text" id="status" placeholder="حالة العمل (مثال: قيد المعالجة)">
    <button onclick="saveData()">إضافة فاتورة جديدة</button>
    
    <div id="dataList" style="margin-top: 20px;"></div>
    <button onclick="clearAll()" style="background:none; color:#64748b; font-size:12px; margin-top:20px;">مسح جميع الفواتير</button>
</div>

<script>
    function saveData() {
        let name = document.getElementById('name').value;
        let status = document.getElementById('status').value;
        if(!name || !status) return alert("الرجاء تعبئة البيانات");
        
        let data = JSON.parse(localStorage.getItem('myBizData') || "[]");
        data.push({name, status});
        localStorage.setItem('myBizData', JSON.stringify(data));
        
        document.getElementById('name').value = '';
        document.getElementById('status').value = '';
        render();
    }

    function render() {
        let data = JSON.parse(localStorage.getItem('myBizData') || "[]");
        let list = document.getElementById('dataList');
        list.innerHTML = data.map((item, index) => `
            <div class="list-item">
                <div><strong>${item.name}</strong><br><small>${item.status}</small></div>
            </div>`).join('');
    }

    function clearAll() {
        if(confirm("هل أنت متأكد من مسح جميع الفواتير؟")) {
            localStorage.removeItem('myBizData');
            render();
        }
    }
    render();
</script>
</body>
</html>
