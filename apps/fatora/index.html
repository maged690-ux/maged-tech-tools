<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة ماجد تك الرقمية</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; color: #f8fafc; padding: 15px; }
        .card { background: #151f32; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; }
        .info-box { background: #1e293b; padding: 15px; border-radius: 15px; margin-bottom: 20px; border-right: 4px solid #38bdf8; font-size: 13px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: #0b0f19; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #38bdf8; color: #0b0f19; }
        .tab { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab button { background: #1e293b; color: white; flex: 1; padding: 10px; border-radius: 10px; border: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>فاتورة ماجد تك</h2>
    <div class="info-box">نظامك الرقمي للفواتير والطلبات. أدر أعمالك وتابع زبائنك بسهولة.</div>

    <div class="tab">
        <button onclick="show('owner')">لوحة الإدارة</button>
        <button onclick="show('client')">استعلام/طلب</button>
    </div>

    <div id="owner" style="display:none;">
        <input type="text" id="phone" placeholder="رقم واتساب الزبون (مثال: 9639xxxxxx)">
        <input type="text" id="code" placeholder="رقم الفاتورة">
        <input type="text" id="name" placeholder="اسم الزبون/الغرض">
        <input type="text" id="status" placeholder="حالة العمل">
        <button class="btn-main" onclick="saveData()">حفظ الفاتورة</button>
        <button style="background:#25d366; color:white" onclick="sendToCustomer()">إرسال الحالة للزبون</button>
    </div>

    <div id="client" style="display:none;">
        <input type="text" id="searchCode" placeholder="رقم فاتورتك للبحث">
        <button class="btn-main" onclick="search()">بحث</button>
        <hr style="border:0; border-top:1px solid #22314d; margin:20px 0;">
        <input type="text" id="newOrder" placeholder="اكتب طلبك هنا (أرسل لماجد تك)">
        <button style="background:#f59e0b; color:#0b0f19" onclick="sendOrder()">إرسال طلب جديد</button>
        <div id="result" style="margin-top:15px; padding:10px; background:#1e293b; display:none; border-radius:10px;"></div>
    </div>
</div>

<script>
    function show(tab) {
        document.getElementById('owner').style.display = tab === 'owner' ? 'block' : 'none';
        document.getElementById('client').style.display = tab === 'client' ? 'block' : 'none';
    }
    
    function saveData() {
        let code = document.getElementById('code').value;
        let db = JSON.parse(localStorage.getItem('myBizData') || "{}");
        db[code] = {
            name: document.getElementById('name').value, 
            status: document.getElementById('status').value,
            phone: document.getElementById('phone').value
        };
        localStorage.setItem('myBizData', JSON.stringify(db));
        alert("تم حفظ البيانات!");
    }

    function sendToCustomer() {
        let phone = document.getElementById('phone').value;
        let name = document.getElementById('name').value;
        let status = document.getElementById('status').value;
        let msg = `مرحباً، تحديث بخصوص طلبك (${name}): *${status}*.`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function search() {
        let db = JSON.parse(localStorage.getItem('myBizData') || "{}");
        let res = document.getElementById('result');
        let data = db[document.getElementById('searchCode').value];
        res.style.display = 'block';
        res.innerHTML = data ? `الاسم: ${data.name}<br>الحالة: ${data.status}` : "كود غير موجود.";
    }

    function sendOrder() {
        let phone = "9639xxxxxxxx"; // ضع رقمك هنا مرة واحدة
        let order = document.getElementById('newOrder').value;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent("طلب جديد: " + order)}`, '_blank');
    }
</script>
</body>
</html>
