<!DOCTYPE html>

        footer { margin-top: 50px; font-size: 0.8em; color: #777; }

</head>

            <a href="apps/fatora/index.html" class="btn">افتح التطبيق</a>

        <div class="card" style="opacity: 0.6;">

        </p>
    </footer>

</body>
</html>
