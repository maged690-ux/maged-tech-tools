<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فاتورة ماجد تك</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>إصدار فاتورة صيانة</h2>
        <input type="text" id="customerName" placeholder="اسم الزبون">
        <input type="text" id="device" placeholder="نوع الجهاز">
        <input type="number" id="price" placeholder="التكلفة">
        <button onclick="alert('جاري تجهيز النظام..!')">إصدار الفاتورة</button>
    </div>
</body>
</html>
