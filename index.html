<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ماجد تك - Maged Tech</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0b0f19; --card: #151f32; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; margin: 0; }
        .wrapper { max-width: 500px; margin: auto; padding-top: 50px; }
        h1 { color: var(--primary); margin: 0; font-size: 28px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        
        /* تنسيق الأزرار المتجاورة */
        .grid-container { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .btn { flex: 1; padding: 20px 10px; background: var(--card); border: 1px solid #22314d; border-radius: 16px; color: var(--text); text-decoration: none; font-weight: bold; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn:hover { border-color: var(--primary); }
        .btn-active { background: var(--primary); color: #0b0f19; }
        
        .social { margin-top: 40px; font-size: 14px; color: #64748b; }
        .social a { color: var(--primary); text-decoration: none; margin: 0 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Maged Tech</h1>
    <p>المنصة الذكية للخدمات والصيانة</p>
    
    <div class="grid-container">
        <a href="apps/fatora/index.html" class="btn btn-active">
            <span>🎫</span>
            <span style="margin-top:8px;">نظام الفاتورة</span>
        </a>
        
        <div class="btn" onclick="alert('جاري العمل على شيء مميز، انتظرونا!')">
            <span>🚀</span>
            <span style="margin-top:8px;">قريباً...</span>
        </div>
    </div>

    <div class="social">
        <p>تابعنا على:</p>
        <a href="https://www.youtube.com/@maged115599" target="_blank">يوتيوب</a> | 
        <a href="https://t.me/Maged_Tech" target="_blank">تليجرام</a> | 
        <a href="https://www.snapchat.com/add/maged-say?share_id=gIEXhAxo6j0&locale=ar-AE" target="_blank">سناب شات</a>
    </div>
</div>

</body>
</html>
