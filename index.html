<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة ماجد تك - Maged Tech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #030712; color: #fff; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin: 0; }
        .header { text-align: center; margin-bottom: 30px; }
        .menu-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 400px; padding: 18px; margin-bottom: 12px; background: #1e293b; color: white; border-radius: 15px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .menu-btn:hover { background: #334155; transform: translateY(-2px); }
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        .btn-social { padding: 15px; border-radius: 12px; text-decoration: none; color: white; text-align: center; font-weight: bold; }
        #redirectModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 1000; text-align: center; }
        #countdown { font-size: 5rem; color: #00ffff; }
    </style>
</head>
<body>
    <div class="header"><h1>Maged Tech ⚡</h1></div>

    <a href="maged-magic-cam/index.html" class="menu-btn">استوديو الخيال <i class="fa-solid fa-camera"></i></a>
    <a href="codes.html" class="menu-btn">أكواد الفحص <i class="fa-solid fa-microchip"></i></a>
    <a href="ar-scanner.html" class="menu-btn">ماسح الـ AR <i class="fa-solid fa-qrcode"></i></a>
    <a href="lab.html" class="menu-btn">المختبر التقني <i class="fa-solid fa-flask"></i></a>

    <div class="social-grid">
        <a href="javascript:void(0)" onclick="startRedirect('https://youtube.com/@maged115599')" class="btn-social" style="background: #ff0000;">يوتيوب</a>
        <a href="javascript:void(0)" onclick="startRedirect('https://t.me/Maged_Tech')" class="btn-social" style="background: #0088cc;">تيليجرام</a>
        <a href="javascript:void(0)" onclick="startRedirect('https://www.facebook.com/share/1J8HF8p72E/')" class="btn-social" style="background: #1877f2;">فيسبوك</a>
        <a href="javascript:void(0)" onclick="startRedirect('https://www.instagram.com/magedtech.official')" class="btn-social" style="background: #e1306c;">إنستغرام</a>
        <a href="javascript:void(0)" onclick="startRedirect('https://www.snapchat.com/add/maged-say')" class="btn-social" style="background: #fffc00; color: #000;">سناب شات</a>
    </div>

    <div id="redirectModal">
        <h2>جاري التحويل...</h2>
        <div id="countdown">5</div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('to')) startRedirect(urlParams.get('to'));
        }
        function startRedirect(url) {
            const modal = document.getElementById('redirectModal');
            const counter = document.getElementById('countdown');
            modal.style.display = 'flex';
            let count = 5;
            counter.innerText = count;
            const timer = setInterval(() => {
                count--;
                counter.innerText = count;
                if (count <= 0) { clearInterval(timer); window.location.href = url; }
            }, 1000);
        }
    </script>
</body>
</html>
