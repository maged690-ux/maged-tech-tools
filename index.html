<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maged Tech Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease;
        }
        .header h1 {
            font-size: 3rem;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.2rem;
            color: #b2bec3;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 400px;
            animation: fadeInUp 1s ease;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 30px;
            border-radius: 15px;
            text-decoration: none;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .menu-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4);
        }
        .menu-btn i {
            font-size: 2rem;
            color: #00ffff;
        }
        .footer {
            margin-top: 50px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Maged Tech ⚡</h1>
        <p>المنصة الذكية المتكاملة للصيانة والمحتوى</p>
    </div>

    <div class="menu-container">
        <a href="camera.html" class="menu-btn">
            <span>استديو الخيال</span>
            <i class="fa-solid fa-camera-retro"></i>
        </a>

        <a href="invoice.html" class="menu-btn">
            <span>الفاتورة الإلكترونية</span>
            <i class="fa-solid fa-file-invoice-dollar"></i>
        </a>

        <a href="codes.html" class="menu-btn">
            <span>أكواد فحص الأجهزة</span>
            <i class="fa-solid fa-microchip"></i>
        </a>
    </div>

    <div class="footer">
        <p>© 2026 Maged Pro. جميع الحقوق محفوظة.</p>
    </div>

</body>
</html>
