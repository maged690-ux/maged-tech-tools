<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maged Tech | Professional Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --glass: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin: 0; }
        
        .brand-box { text-align: center; margin: 30px 0; }
        .brand-box h1 { font-size: 2.5rem; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px var(--neon); margin: 0; }
        
        .clock-card { background: var(--glass); backdrop-filter: blur(10px); padding: 20px; border-radius: 25px; width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 242, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); } }
        
        .menu-btn { width: 90%; max-width: 400px; padding: 20px; margin-bottom: 15px; background: linear-gradient(135deg, #1a1a1a, #0f0f0f); border: 1px solid #333; color: white; border-radius: 20px; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: 0.4s; animation: pulse 3s infinite; }
        .menu-btn:hover { border-color: var(--neon); transform: translateY(-3px); }
        
        #prayer-content { display: none; padding: 15px; background: #111; border-radius: 15px; width: 90%; max-width: 400px; margin-top: -10px; margin-bottom: 15px; border: 1px solid #333; font-size: 0.9rem; }
        .prayer-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #222; }
        
        .social-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 90%; max-width: 400px; margin-top: 20px; }
        .btn-social { padding: 15px; border-radius: 12px; text-decoration: none; text-align: center; color: white; font-weight: bold; transition: 0.3s; border: 1px solid #333; }
        .btn-social:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .yt { background: #FF0000; }
        .tg { background: #0088CC; }
        .sc { background: #FFFC00; color: #000 !important; }
        .fb { background: #1877F2; grid-column: span 2; }
        .ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); grid-column: span 2; }
    </style>
</head>
<body>

    <div class="brand-box">
        <h1>MAGED <span style="color:var(--neon)">TECH</span></h1>
    </div>

    <div class="clock-card">
        <div id="live-clock" style="font-size: 1.8rem; font-weight: bold; color: var(--neon);">00:00</div>
        <div id="date-text" style="color: #888; font-size: 0.8rem;">...</div>
    </div>

    <a href="#" class="menu-btn" onclick="document.getElementById('prayer-content').style.display = (document.getElementById('prayer-content').style.display === 'block' ? 'none' : 'block');">
        <span>مواقيت الصلاة | Prayer Times</span>
        <i class="fa-solid fa-mosque" style="color:var(--neon)"></i>
    </a>
    <div id="prayer-content"></div>

    <a href="apps/fatora/index.html" class="menu-btn">
        <span>نظام الفواتير | Invoicing System</span>
        <i class="fa-solid fa-file-invoice-dollar" style="color:var(--neon)"></i>
    </a>

    <a href="maged-magic-cam/index.html" class="menu-btn">
        <span>استوديو الخيال | Magic Cam Studio</span>
        <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--neon)"></i>
    </a>

    <a href="codes.html" class="menu-btn">
        <span>أكواد الأجهزة | Diagnostic Codes</span>
        <i class="fa-solid fa-microchip" style="color:var(--neon)"></i>
    </a>

    <div class="social-grid">
        <a href="https://youtube.com/@maged115599" class="btn-social yt"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://t.me/Maged_Tech" class="btn-social tg"><i class="fa-brands fa-telegram"></i></a>
        <a href="https://www.snapchat.com/add/maged-say" class="btn-social sc"><i class="fa-brands fa-snapchat"></i></a>
        <a href="https://www.facebook.com/share/1J8HF8p72E/" class="btn-social fb">Facebook</a>
        <a href="https://www.instagram.com/magedtech.official" class="btn-social ig">Instagram</a>
    </div>

    <script>
        function formatTime12(time24) {
            let [h, m] = time24.split(':');
            h = parseInt(h);
            let suff = h >= 12 ? ' م' : ' ص';
            h = h % 12 || 12;
            return `${h}:${m}${suff}`;
        }

        setInterval(() => {
            const now = new Date();
            let h = now.getHours(), m = now.getMinutes();
            let suff = h >= 12 ? ' PM' : ' AM';
            h = h % 12 || 12;
            document.getElementById('live-clock').innerText = `${h}:${m.toString().padStart(2,'0')} ${suff}`;
            document.getElementById('date-text').innerText = new Date().toLocaleDateString('ar-SY');
        }, 1000);

        fetch('https://api.aladhan.com/v1/timingsByCity?city=Damascus&country=Syria&method=8')
            .then(res => res.json())
            .then(data => {
                const p = data.data.timings;
                const list = {'الفجر': p.Fajr, 'الظهر': p.Dhuhr, 'العصر': p.Asr, 'المغرب': p.Maghrib, 'العشاء': p.Isha};
                const container = document.getElementById('prayer-content');
                for (let name in list) {
                    container.innerHTML += `<div class="prayer-row"><span>${name}</span><span>${formatTime12(list[name])}</span></div>`;
                }
            });
    </script>
</body>
</html>
