<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maged Tech | Professional Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --neon: #00f2ff; 
            --bg: #050505; 
            --glass: rgba(255, 255, 255, 0.05); 
        }
        body { 
            background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin: 0;
        }
        
        /* الشعار الفخم */
        .brand-box { text-align: center; margin: 30px 0; }
        .brand-box h1 { 
            font-size: 2.5rem; letter-spacing: 2px; color: #fff;
            text-shadow: 0 0 20px var(--neon); margin: 0;
        }

        /* العداد */
        .clock-card { 
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 25px; width: 90%; max-width: 400px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px;
        }

        /* الأزرار الاحترافية */
        .menu-btn { 
            width: 90%; max-width: 400px; padding: 20px; margin-bottom: 15px;
            background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
            border: 1px solid #333; color: white; border-radius: 20px;
            text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
            transition: all 0.4s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .menu-btn:hover { 
            border-color: var(--neon); transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); 
        }

        /* شبكة السوشيال */
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 95%; max-width: 420px; margin-top: 20px; }
        .social-btn { 
            padding: 15px; border-radius: 15px; text-decoration: none; text-align: center;
            background: #111; border: 1px solid #222; color: #ccc; transition: 0.3s;
        }
        .social-btn:hover { color: var(--neon); border-color: var(--neon); }
    </style>
</head>
<body>

    <div class="brand-box">
        <h1>MAGED <span style="color:var(--neon)">TECH</span></h1>
        <p style="color:#666; font-size: 0.9rem;">Advanced Digital Solutions</p>
    </div>

    <div class="clock-card">
        <div id="live-clock" style="font-size: 1.8rem; font-weight: bold; color: var(--neon);">00:00</div>
        <div id="date-text" style="font-size: 0.8rem; color: #888; margin-top: 5px;"></div>
    </div>

    <a href="apps/fatora/index.html" class="menu-btn">
        <span>نظام الفواتير | Invoicing System</span>
        <i class="fa-solid fa-file-invoice-dollar" style="color:var(--neon)"></i>
    </a>

    <a href="maged-magic-cam/index.html" class="menu-btn">
        <span>استوديو الخيال | Magic Cam Studio</span>
        <i class="fa-solid fa-wand-magic-sparkles" style="color:var(--neon)"></i>
    </a>

    <a href="codes.html" class="menu-btn">
        <span>أكواد الأجهزة | Diagnostic Codes</span>
        <i class="fa-solid fa-microchip" style="color:var(--neon)"></i>
    </a>

    <div class="social-grid">
        <a href="#" class="social-btn"><i class="fa-brands fa-telegram"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-btn"><i class="fa-brands fa-facebook"></i></a>
    </div>

    <script>
        // ساعة محدثة
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('date-text').innerText = new Date().toLocaleDateString('ar-SY');
        }, 1000);
    </script>
</body>
</html>
