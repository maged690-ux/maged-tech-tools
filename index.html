<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Maged Tech Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --accent: #00ffff; --bg: #030712; --text: #ffffff; }
        @media (prefers-color-scheme: light) { :root { --accent: #0284c7; --bg: #f8fafc; --text: #0f172a; } }
        
        body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; margin: 0; transition: 0.3s; }
        
        .header { text-align: center; margin-bottom: 20px; }
        
        /* تأثير النبض للأزرار */
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 255, 0); } }
        
        .menu-btn { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px; padding: 15px; margin-bottom: 15px; background: #1e293b; border: 2px solid var(--accent); color: var(--text); border-radius: 15px; text-decoration: none; font-weight: bold; animation: pulse 2s infinite; }
        
        .info-text { font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        
        .calendar-card { background: #1e293b; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; border: 1px solid var(--accent); }
        .clock { font-size: 2rem; color: var(--accent); }
        
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
        .btn-social { padding: 12px; border-radius: 12px; text-decoration: none; color: white; text-align: center; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header"><h1>Maged Tech ⚡</h1></div>

    <div class="calendar-card">
        <div id="live-clock" class="clock">00:00:00</div>
        <div id="dates-display" class="dates">...</div>
        <div id="prayers-container" style="font-size: 0.8rem; margin-top: 10px;"></div>
    </div>

    <div class="info-text">نظام إدارة الفواتير الرقمي المطور</div>
    <a href="apps/fatora/index.html" class="menu-btn">Digital Invoicing System <i class="fa-solid fa-file-invoice"></i></a>

    <a href="maged-magic-cam/index.html" class="menu-btn">Magic Cam Studio <i class="fa-solid fa-wand-magic-sparkles"></i></a>
    
    <a href="codes.html" class="menu-btn">Phone Diagnostic Codes <i class="fa-solid fa-microchip"></i></a>

    <div class="social-grid">
        <a href="https://youtube.com/@maged115599" class="btn-social" style="background: #ff0000;">YouTube</a>
        <a href="https://t.me/Maged_Tech" class="btn-social" style="background: #0088cc;">Telegram</a>
        <a href="https://www.facebook.com/share/1J8HF8p72E/" class="btn-social" style="background: #1877f2;">Facebook</a>
        <a href="https://www.instagram.com/magedtech.official" class="btn-social" style="background: #e1306c;">Instagram</a>
    </div>

    <script>
        // التوقيت 12 ساعة
        setInterval(() => {
            const now = new Date();
            let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            let suff = h >= 12 ? ' PM' : ' AM';
            h = h % 12 || 12;
            document.getElementById('live-clock').innerText = `${h}:${m.toString().padStart(2,'0')} ${suff}`;
        }, 1000);

        // جلب المواقيت
        fetch('https://api.aladhan.com/v1/timingsByCity?city=Damascus&country=Syria&method=8')
            .then(res => res.json())
            .then(data => {
                document.getElementById('dates-display').innerText = data.data.date.gregorian.date;
                const p = data.data.timings;
                document.getElementById('prayers-container').innerText = `الفجر: ${p.Fajr} | الظهر: ${p.Dhuhr} | المغرب: ${p.Maghrib}`;
            });
    </script>
</body>
</html>
