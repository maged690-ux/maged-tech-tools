<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ماجد تك - Maged Tech</title>
    <style>
        :root { --primary: #38bdf8; --bg: #0b0f19; --card: #151f32; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .header { margin-bottom: 40px; text-align: center; }
        h1 { color: var(--primary); margin: 0; font-size: 32px; letter-spacing: 1px; }
        p { color: #94a3b8; margin-top: 10px; font-size: 16px; }
        
        .grid-container { display: flex; gap: 20px; width: 100%; max-width: 600px; }
        .btn { flex: 1; padding: 60px 20px; background: var(--card); border: 2px solid #22314d; border-radius: 24px; color: var(--text); text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn:hover { border-color: var(--primary); background: #1e293b; }
        .btn-active { background: var(--primary); color: #0b0f19; border: none; }
        .btn-active:hover { background: #7dd3fc; border: none; }
        
        .social { margin-top: 60px; font-size: 14px; color: #64748b; }
        .social a { color: var(--primary); text-decoration: none; margin: 0 10px; font-weight: bold; }
    </style>
</head>
