        let fwCanvas, fwCtx, particles = [];
        function startFireworksLoop() {
            fwCanvas = document.getElementById('fireworksCanvas'); fwCtx = fwCanvas.getContext('2d');
            resizeFwCanvas(); window.addEventListener('resize', resizeFwCanvas); renderFireworks();
            fireworksInterval = setInterval(() => { createFirework(Math.random() * fwCanvas.width, Math.random() * (fwCanvas.height * 0.5) + 100); }, 600);
        }
        function resizeFwCanvas() { if(fwCanvas) { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; } }
        function createFirework(x, y) {
            const colors = ['#ffd700', '#00adb5', '#ff2e63', '#25d366', '#f59e0b', '#a855f7', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 50; i++) { particles.push({ x: x, y: y, angle: Math.random() * Math.PI * 2, speed: Math.random() * 4 + 2, friction: 0.96, gravity: 0.1, alpha: 1, decay: Math.random() * 0.015 + 0.01, color: color }); }
        }
        function renderFireworks() {
            if (document.getElementById('liveViewOverlay').style.display !== 'flex') return;
            requestAnimationFrame(renderFireworks); fwCtx.fillStyle = 'rgba(2, 6, 23, 0.15)'; fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.speed *= p.friction; p.x += Math.cos(p.angle) * p.speed; p.y += Math.sin(p.angle) * p.speed + p.gravity; p.alpha -= p.decay;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                fwCtx.save(); fwCtx.globalAlpha = p.alpha; fwCtx.fillStyle = p.color; fwCtx.beginPath(); fwCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); fwCtx.fill(); fwCtx.restore();
            }
        }
