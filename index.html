<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maged Tech Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease;
        }
        .header h1 {
            font-size: 3.5rem;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 1.2rem;
            color: #b2bec3;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 450px;
            animation: fadeInUp 1s ease;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 20px 30px;
            border-radius: 15px;
            text-decoration: none;
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .menu-btn:hover {
            background: rgba(0, 255, 255, 0.15);
            border-color: #00ffff;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5);
        }
        .menu-btn i {
            font-size: 2.2rem;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        /* أيقونات السوشيال ميديا */
        .social-container {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            animation: fadeInUp 1s ease 0.3s both; /* تظهر بعد الأزرار بشوي */
        }
        .social-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: #fff;
            font-size: 1.5rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            color: #00ffff;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 255, 0.4);
        }

        .footer {
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 0.9rem;
            text-align: center;
        }

        /* نافذة الانتظار 5 ثواني (Popup) */
        .redirect-modal {
            display: none; /* مخفية بالوضع الافتراضي */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .redirect-content {
            background: linear-gradient(135deg, #1f2f38, #101920);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            width: 90%;
            max-width: 400px;
            animation: popIn 0.4s ease;
        }
        .redirect-content h2 {
            color: #00ffff;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        .countdown-wrapper {
            position: relative;
            width: 80px; height: 80px;
            margin: 0 auto 20px auto;
        }
        .countdown-spinner {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(0, 255, 255, 0.1);
            border-top-color: #00ffff;
            animation: spin 1s linear infinite;
        }
        #countdown-number {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
        }
        .redirect-msg {
            color: #b2bec3;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .cancel-btn {
            padding: 10px 30px;
            background: #ff3b30;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .cancel-btn:hover {
            background: #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.5);
        }
        
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Maged Tech ⚡</h1>
        <p>المنصة الذكية المتكاملة للصيانة والمحتوى</p>
    </div>

    <div class="menu-container">
        <a href="maged-magic-cam/index.html" class="menu-btn">
            <span>استديو الخيال</span>
            <i class="fa-solid fa-camera-retro"></i>
        </a>
        <a href="codes.html" class="menu-btn">
            <span>أكواد الفحص</span>
            <i class="fa-solid fa-microchip"></i>
        </a>
        <a href="ar-scanner.html" class="menu-btn">
            <span>ماسح الـ AR</span>
            <i class="fa-solid fa-qrcode"></i>
        </a>
        <a href="lab.html" class="menu-btn">
            <span>المختبر التقني</span>
            <i class="fa-solid fa-flask"></i>
        </a>
    </div>

    <div class="social-container">
        <button class="social-btn" onclick="startRedirect('https://t.me/MagedTech')"><i class="fa-brands fa-telegram"></i></button>
        <button class="social-btn" onclick="startRedirect('https://snapchat.com/add/MagedTech')"><i class="fa-brands fa-snapchat"></i></button>
        <button class="social-btn" onclick="startRedirect('https://youtube.com/c/MagedTech')"><i class="fa-brands fa-youtube"></i></button>
        <button class="social-btn" onclick="startRedirect('https://facebook.com/MagedTech')"><i class="fa-brands fa-facebook-f"></i></button>
        <button class="social-btn" onclick="startRedirect('https://instagram.com/MagedTech')"><i class="fa-brands fa-instagram"></i></button>
    </div>

    <div class="footer">
        <p>© 2026 Maged Tech Tools. جميع الحقوق محفوظة.</p>
    </div>

    <div id="redirect-modal" class="redirect-modal">
        <div class="redirect-content">
            <h2>جاري التحويل...</h2>
            <div class="countdown-wrapper">
                <div class="countdown-spinner"></div>
                <span id="countdown-number">5</span>
            </div>
            <p class="redirect-msg">يرجى الانتظار، سيتم نقلك إلى المنصة المطلوبة بأمان.</p>
            <button onclick="cancelRedirect()" class="cancel-btn">إلغاء التحويل</button>
        </div>
    </div>

    <script>
        let countdownTimer;
        let timeLeft = 5;

        function startRedirect(targetUrl) {
            const modal = document.getElementById('redirect-modal');
            const numberDisplay = document.getElementById('countdown-number');
            
            // إعادة ضبط الوقت لـ 5 ثواني
            timeLeft = 5;
            numberDisplay.textContent = timeLeft;
            modal.style.display = 'flex'; // إظهار النافذة المنبثقة

            // بدء العداد التنازلي
            countdownTimer = setInterval(() => {
                timeLeft--;
                numberDisplay.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    window.location.href = targetUrl; // التحويل للرابط المطلوب
                }
            }, 1000);
        }

        function cancelRedirect() {
            // إيقاف المؤقت وإخفاء النافذة إذا ضغط المستخدم "إلغاء"
            clearInterval(countdownTimer);
            document.getElementById('redirect-modal').style.display = 'none';
        }
    </script>
</body>
</html>
