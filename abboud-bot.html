<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maged tech | المساعد الذكي عبود</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00ff88; --bg: #05050a; --chat-bg: #111116; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        
        .chat-container { width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border-radius: 24px; border: 1px solid rgba(0, 255, 136, 0.2); overflow: hidden; display: flex; flex-direction: column; height: 85vh; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
        
        header { background: rgba(0, 255, 136, 0.1); padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid rgba(0, 255, 136, 0.3); }
        .back-btn { color: var(--neon); text-decoration: none; font-size: 1.5rem; margin-left: 15px; }
        .header-title { display: flex; flex-direction: column; }
        .header-title h2 { margin: 0; font-size: 1.2rem; color: var(--neon); }
        .header-title span { font-size: 0.8rem; color: #aaa; }

        .chat-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 1rem; line-height: 1.6; position: relative; white-space: pre-line; }
        .msg-abboud { background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.3); align-self: flex-start; border-top-right-radius: 0; }
        .msg-user { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); align-self: flex-end; border-top-left-radius: 0; color: #00f2ff; font-weight: bold; }
        
        /* منطقة الإدخال */
        .input-area { display: flex; padding: 15px; background: rgba(0, 0, 0, 0.5); border-top: 1px solid rgba(0, 255, 136, 0.2); gap: 10px; }
        .input-area input { flex-grow: 1; padding: 12px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 12px; color: #fff; font-family: 'Tajawal'; font-size: 1rem; outline: none; transition: 0.3s; }
        .input-area input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        .send-btn { background: var(--neon); color: #000; border: none; padding: 12px 18px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
        .send-btn:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        /* مؤشر الكتابة */
        .typing-indicator { display: none; padding: 10px 15px; background: rgba(0, 255, 136, 0.1); border-radius: 15px; align-self: flex-start; border-top-right-radius: 0; border: 1px solid rgba(0, 255, 136, 0.3); width: fit-content; }
        .dot { display: inline-block; width: 6px; height: 6px; background-color: var(--neon); border-radius: 50%; margin: 0 2px; animation: bounce 1.3s linear infinite; }
        .dot:nth-child(2) { animation-delay: -1.1s; }
        .dot:nth-child(3) { animation-delay: -0.9s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
    </style>
</head>
<body>

<div class="chat-container">
    <header>
        <!-- رابط العودة للصفحة الرئيسية -->
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i></a>
        <i class="fa-solid fa-robot" style="font-size: 2rem; color: var(--neon); margin-left: 15px;"></i>
        <div class="header-title">
            <h2>المساعد عبود</h2>
            <span>ذكاء اصطناعي متصل | ورشة maged tech</span>
        </div>
    </header>

    <div class="chat-box" id="chatBox">
        <div class="message msg-abboud">
            أهلين يا معلم! أنا عبود، مساعدك بالورشة. هات لشوف، اكتبلي العطل اللي مجننك (مثال: مسار إضاءة نوت 10، أو تخطي حساب A51) وخليني أعطيك الزبدة وخطوات الفحص!
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب العطل هنا يا معلم..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // إرسال الرسالة عند الضغط على زر Enter
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // النزول لأسفل المحادثة تلقائياً
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // دالة ترجمة أخطاء السيرفر إلى لهجة عبود
    function translateError(errorMessage) {
        let msg = errorMessage.toLowerCase();
        if (msg.includes("high demand") || msg.includes("resource_exhausted")) return "السيرفر عليه ضغط يا معلم! ريح كاوية اللحام 30 ثانية وارجع اسألني.";
        if (msg.includes("quota")) return "خلصت المحاولات المجانية السريعة، استنى شوي وجرب مرة تانية.";
        if (msg.includes("failed to fetch") || msg.includes("network")) return "يا معلم مافي إنترنت! تأكد من الوصلة أو شغل كاسر الحجب (VPN).";
        return "في مشكلة بالنظام: " + errorMessage;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. إضافة رسالة الفني للشاشة
        const userMsg = document.createElement('div');
        userMsg.className = 'message msg-user';
        userMsg.innerText = text;
        chatBox.insertBefore(userMsg, typingIndicator);
        
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';
        scrollToBottom();

        // 2. العقل المدبر: صياغة شخصية عبود (مساعد الورشة)
        const systemPrompt = `أنت اسمك "عبود"، وتعمل كموظف ومساعد فني لدى المعلم في ورشة صيانة الهواتف "maged tech". 
طريقتك في الكلام مرحة وتستخدم اللهجة الشامية السورية بشكل طبيعي (مثل: يا معلم، على راسي، هات لشوف، كاوية اللحام، الآفو).
رغم أسلوبك المرح، أنت خبير تقني محترف جداً في صيانة الموبايلات (هاردوير وسوفت وير).
المستخدم سيكتب لك مشكلة أو عطل في هاتف. المطلوب منك:
1. الترحيب بشكل مرح وسريع باللهجة الشامية كأنك تستقبل زميل في الورشة.
2. إعطاء خطوات فحص وتشخيص دقيقة جداً ومسارات احترافية للمشكلة التي طلبها.
3. كن مختصراً ومباشراً في الخطوات العلمية، ونسق الإجابة بنقاط واضحة.
العطل المطلوب حله هو: ${text}`;

        const requestBody = {
            contents: [{ parts: [{ text: systemPrompt }] }]
        };

        // 3. إرسال الطلب لسيرفر Vercel الخاص بمنصتك
        try {
            const response = await fetch('https://maged-tech-tools.vercel.app/api/gemini', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            
            typingIndicator.style.display = 'none';

            let responseText = "";
            if (data.error) {
                responseText = translateError(data.error.message || JSON.stringify(data.error));
            } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                responseText = data.candidates[0].content.parts[0].text;
            } else {
                responseText = "معلش يا معلم، السيرفر علق وما قدرت أحلل العطل.";
            }

            // 4. عرض رد عبود
            const abboudMsg = document.createElement('div');
            abboudMsg.className = 'message msg-abboud';
            abboudMsg.innerText = responseText;
            chatBox.insertBefore(abboudMsg, typingIndicator);

        } catch (e) {
            typingIndicator.style.display = 'none';
            const errorMsg = document.createElement('div');
            errorMsg.className = 'message msg-abboud';
            errorMsg.innerText = translateError(e.message);
            chatBox.insertBefore(errorMsg, typingIndicator);
        }

        // إعادة تفعيل مربع الإدخال بعد الرد
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        scrollToBottom();
    }
</script>

</body>
</html>
