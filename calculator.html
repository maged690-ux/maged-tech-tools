<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة Maged Tech الهندسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00bcd4; --bg: #05050a; }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: var(--bg); 
            color: #f0f0f0; 
            padding: 20px; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator-container { 
            width: 100%;
            max-width: 400px; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 18px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.08); 
        }
        /* تصميم الهيدر وزر الرجوع */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .back-btn { color: #fff; text-decoration: none; font-size: 1.5rem; background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 10px; transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .back-btn:hover { border-color: var(--neon); color: var(--neon); box-shadow: 0 0 10px var(--neon); }
        h2 { color: var(--neon); margin: 0; font-size: 1.4rem; text-shadow: 0 0 10px rgba(0, 188, 212, 0.4); text-align: center; flex-grow: 1; }
        
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ddd; font-size: 1.1rem; }
        input { width: 100%; padding: 15px; border: 1px solid #444; border-radius: 10px; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; font-size: 16px; font-family: 'Tajawal', sans-serif; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 10px rgba(0, 188, 212, 0.3); background: rgba(0,0,0,0.8); }
        
        button { font-family: 'Tajawal', sans-serif; background-color: var(--neon); color: #111; font-weight: 900; padding: 15px; border: none; border-radius: 10px; cursor: pointer; width: 100%; font-size: 1.2rem; margin-top: 10px; transition: all 0.3s; box-shadow: 0 5px 15px rgba(0, 188, 212, 0.2); }
        button:hover { background-color: #008ba3; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 188, 212, 0.4); }
        button:active { transform: translateY(2px); }
        
        .btn-clear { background-color: transparent; color: #f44336; border: 1px solid #f44336; margin-top: 15px; box-shadow: none; }
        .btn-clear:hover { background-color: #f44336; color: white; box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3); }
        
        .result { margin-top: 25px; padding: 20px; background: rgba(0, 188, 212, 0.1); border-radius: 10px; display: none; border-right: 4px solid var(--neon); text-align: center; }
        .result h3 { margin: 10px 0; color: #fff; font-size: 1.3rem; direction: ltr; }
        .result span { color: var(--neon); }
    </style>
</head>
<body>

<div class="calculator-container">
    <header>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i></a>
        <h2>حاسبة الفولت والأوم</h2>
        <div style="width: 45px;"></div> </header>

    <p>أدخل قيمتين فقط ليتم حساب الثالثة تلقائياً:</p>
    
    <div class="input-group">
        <label for="voltage">الفولت (V):</label>
        <input type="number" id="voltage" placeholder="مثال: 4.2">
    </div>
    <div class="input-group">
        <label for="current">الأمبير (I):</label>
        <input type="number" id="current" placeholder="مثال: 2">
    </div>
    <div class="input-group">
        <label for="resistance">المقاومة (R - Ω):</label>
        <input type="number" id="resistance" placeholder="مثال: 100">
    </div>

    <button onclick="calculateOhm()">احسب الآن <i class="fa-solid fa-calculator" style="margin-right: 8px;"></i></button>
    <button onclick="clearFields()" class="btn-clear">مسح الحقول <i class="fa-solid fa-trash-can" style="margin-right: 8px;"></i></button>

    <div class="result" id="result-box">
        <h3 id="res-v"></h3>
        <h3 id="res-i"></h3>
        <h3 id="res-r"></h3>
    </div>
</div>

<script>
    function calculateOhm() {
        let v = parseFloat(document.getElementById('voltage').value);
        let i = parseFloat(document.getElementById('current').value);
        let r = parseFloat(document.getElementById('resistance').value);
        let resultBox = document.getElementById('result-box');

        if (!isNaN(v) && !isNaN(i)) {
            r = v / i;
            document.getElementById('resistance').value = r.toFixed(2);
        } else if (!isNaN(v) && !isNaN(r)) {
            i = v / r;
            document.getElementById('current').value = i.toFixed(2);
        } else if (!isNaN(i) && !isNaN(r)) {
            v = i * r;
            document.getElementById('voltage').value = v.toFixed(2);
        } else {
            alert("يرجى إدخال قيمتين على الأقل لإتمام الحساب!");
            return;
        }

        document.getElementById('res-v').innerHTML = `الفولت = <span>${document.getElementById('voltage').value} V</span>`;
        document.getElementById('res-i').innerHTML = `الأمبير = <span>${document.getElementById('current').value} A</span>`;
        document.getElementById('res-r').innerHTML = `المقاومة = <span>${document.getElementById('resistance').value} Ω</span>`;
        resultBox.style.display = "block";
    }

    function clearFields() {
        document.getElementById('voltage').value = "";
        document.getElementById('current').value = "";
        document.getElementById('resistance').value = "";
        document.getElementById('result-box').style.display = "none";
    }
</script>

</body>
</html>
