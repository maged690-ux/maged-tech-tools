<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الفحص الذكي بالـ AI</title>
    </head>
<body>
    <div class="ai-container">
        <div class="scanner-visual"><div class="laser-line" id="laser"></div><img id="preview-img"></div>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <p>ارفع صورة البوردة</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="loadPreview(event)">
        </div>
        <button id="scanBtn" onclick="startRealAIScan()" style="display: none;">بدء الفحص</button>
        <div class="ai-result-box" id="aiResult">
            <div class="result-status" id="resultStatusIcon"></div>
            <div class="result-details" id="aiDetails"></div>
        </div>
    </div>

<script>
    let base64ImageData = "";
    let imageMimeType = "";

    function loadPreview(event) {
        const file = event.target.files[0];
        if (file) {
            imageMimeType = file.type;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('preview-img').style.display = "block";
                base64ImageData = e.target.result.split(',')[1];
                document.getElementById('scanBtn').style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    }

    async function startRealAIScan() {
        const btn = document.getElementById('scanBtn');
        const details = document.getElementById('aiDetails');
        
        btn.disabled = true;
        btn.innerText = "جاري التحليل...";
        
        try {
            const response = await fetch(`https://maged-tech-tools.vercel.app/api/scan`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mimeType: imageMimeType, data: base64ImageData })
            });

            const data = await response.json();
            
            if (response.ok) {
                details.innerText = data.candidates[0].content.parts[0].text;
            } else {
                details.innerText = "خطأ: " + (data.error || "فشل الاتصال");
            }
        } catch (e) {
            details.innerText = "حدث خطأ أثناء الاتصال بالسيرفر";
        } finally {
            btn.disabled = false;
            btn.innerText = "بدء الفحص";
            document.getElementById('aiResult').style.display = "block";
        }
    }
</script>
</body>
</html>
