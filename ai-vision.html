<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Maged Tech | الفحص الذكي</title>
    <style>
        body { font-family: sans-serif; background: #05050a; color: white; text-align: center; padding: 20px; }
        .upload-box { border: 2px dashed #00f2ff; padding: 30px; border-radius: 15px; margin: 20px auto; max-width: 400px; cursor: pointer; }
        button { background: #ff0055; padding: 15px 30px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; text-align: right; background: #111; padding: 15px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <h1>منصة Maged Tech</h1>
    <div class="upload-box" onclick="document.getElementById('file').click()">اختر صورة البوردة 📸</div>
    <input type="file" id="file" hidden onchange="process(event)">
    <button id="btn" style="display:none" onclick="scan()">بدء الفحص 🚀</button>
    <div id="result"></div>

    <script>
        let imgData = "", imgMime = "";
        function process(e) {
            const f = e.target.files[0];
            imgMime = f.type;
            const r = new FileReader();
            r.onload = (e) => { imgData = e.target.result.split(',')[1]; document.getElementById('btn').style.display = "inline-block"; };
            r.readAsDataURL(f);
        }
        async function scan() {
            document.getElementById('btn').innerText = "جاري التحليل...";
            const res = await fetch(`https://maged-tech-tools.vercel.app/api/scan`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mimeType: imgMime, data: imgData })
            });
            const d = await res.json();
            const resDiv = document.getElementById('result');
            resDiv.style.display = "block";
            resDiv.innerText = d.candidates ? d.candidates[0].content.parts[0].text : "خطأ في الاتصال بالسيرفر";
            document.getElementById('btn').innerText = "بدء الفحص 🚀";
        }
    </script>
</body>
</html>
