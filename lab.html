<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

            <span class="status">الحالة: قيد الاختبار</span>
        </div>

        <div class="experiment-card">
            <h3>لعبة فك وتركيب</h3>
            <p>تحدي السرعة والدقة في الصيانة</p>

</html>
