<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبر ماجد تك | مصنع بطاقات العيد 🐑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #00adb5;
            --eid-gold: #ffd700;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        /* زينة العيد المتحركة في الخلفية */
        .eid-decor {
            position: fixed;
            top: -50px;
            font-size: 1.8rem;
            z-index: 1;
            animation: fall linear infinite;
            opacity: 0.12;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        header {
            text-align: center;
            padding: 50px 20px 20px 20px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2.6rem;
            margin: 0;
            color: var(--primary-color);
            text-shadow: 0 0 25px rgba(0, 173, 181, 0.4);
        }

        /* حاوية الأداة المحدثة */
        .workspace-section {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .workspace-section h3 {
            color: var(--eid-gold);
            text-align: center;
            margin-top: 0;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            font-size: 1rem;
            resize: none;
        }

        .input-group textarea:focus, .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(45deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* صندوق استعراض البطاقة الناتجة */
        .preview-box {
            display: none;
            margin-top: 30px;
            text-align: center;
            border-top: 2px dashed #334155;
            padding-top: 25px;
        }

        canvas {
            display: none;
        }

        .card-result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 2px solid var(--eid-gold);
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-download {
            background: #059669;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-download:hover { background: #10b981; }

        .btn-share-wa {
            background: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-share-wa:hover { background: #1ebd59; }
    </style>
</head>
<body>

    <div id="eid-decor-container"></div>

    <header>
        <h1>مخبر ماجد تك <span style="color: var(--eid-gold);">|</span> Lab</h1>
        <p>النسخة المتطورة: اصنع بطاقة العيد الاحترافية بكلماتك أو بقوالب جاهزة 🎨</p>
    </header>

    <div class="workspace-section">
        <h3>🎨 مـصـنـع الـبـطـاقـات الـذكـي</h3>
        <p style="text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;">اختر نمط الكرت ونوع الكلام، أو اكتب رسالتك الخاصة لتُطبع فوراً داخل بطاقة مزخرفة فخمة!</p>

        <div class="input-group">
            <label><i class="fa-solid fa-signature"></i> اسمك الشخصي أو اسم المحل (التوقيع بالأسفل):</label>
            <input type="text" id="cardName" placeholder="مثال: ماجد العلي / عائلة أبو محمد / ماجد تك">
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-envelope-open-text"></i> اختر نص التهنئة أو اكتب كلامك الخاص:</label>
            <select id="textTemplateSelect" onchange="toggleCustomTextarea()">
                <option value="warm">❤️ تهنئة عائلية دافئة وقريبة للقلب (للأهل والأقارب)</option>
                <option value="friendly">🎉 تهنئة شبابية ممتعة ومرحة (للأصدقاء والجروبات)</option>
                <option value="business">👔 تهنئة مهنية رسمية راقية (للزبائن والعمل)</option>
                <option value="custom">✍️ [نص مخصص كلياً] اكتب رسالتك بنفسك هنا</option>
            </select>
        </div>

        <div class="input-group" id="customTextContainer" style="display: none;">
            <label style="color: var(--eid-gold);"><i class="fa-solid fa-pen"></i> اكتب نص المعايدة الخاص بك هنا:</label>
            <textarea id="customText" rows="3" placeholder="اكتب هنا ما تريده أن يظهر بمنتصف البطاقة..."></textarea>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-palette"></i> اختر المظهر الفني والخلفية للبطاقة:</label>
            <select id="cardStyle">
                <option value="royal-dark">👑 فخامة ملكية (ليلي أسود ملكي مع زخارف ذهبية مشعة)</option>
                <option value="emerald-gold">🟢 الزمرد الأخضر (خلفية خضراء عريقة مع خطوط إسلامية فخمة)</option>
                <option value="modern-tech">⚡ تيل تقني معتق (طابع Maged Tech المميز والألوان الرقمية زاهية)</option>
            </select>
        </div>

        <button class="generate-btn" onclick="drawEidCard()"><i class="fa-solid fa-wand-magic-sparkles"></i> ابتكار وتوليد البطاقة المرئية</button>

        <div class="preview-box" id="previewBox">
            <h4 style="color: var(--primary-color); margin-bottom: 15px;"><i class="fa-solid fa-image"></i> بطاقتك المزخرفة الحصرية جاهزة:</h4>
            <img id="finalCardImg" class="card-result-image" alt="بطاقة معايدة">
            
            <div class="action-btns">
                <a id="downloadLink" class="btn-download" download="Eid_Mubarak_MagedTech.png"><i class="fa-solid fa-download"></i> حفظ الصورة بجهازك</a>
                <a id="whatsappLink" class="btn-share-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> إرسال واتساب</a>
            </div>
        </div>
    </div>

    <canvas id="cardCanvas" width="800" height="800"></canvas>

    <script>
        // 1. حركة زينة العيد بالخلفية
        const icons = ['🐑', '🌙', '⭐', '✨'];
        const decorContainer = document.getElementById('eid-decor-container');
        for (let i = 0; i < 15; i++) {
            const element = document.createElement('div');
            element.className = 'eid-decor';
            element.innerText = icons[Math.floor(Math.random() * icons.length)];
            element.style.left = Math.random() * 100 + 'vw';
            element.style.animationDuration = (Math.random() * 5 + 6) + 's';
            element.style.animationDelay = (Math.random() * 5) + 's';
            decorContainer.appendChild(element);
        }

        // 2. إظهار/إخفاء صندوق النص المخصص
        function toggleCustomTextarea() {
            const selectValue = document.getElementById('textTemplateSelect').value;
            const container = document.getElementById('customTextContainer');
            if (selectValue === 'custom') {
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        // دالة مساعدة لتوزيع النص على أسطر بداخل الكانفاس لتفادي خروج النص عن الصورة
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const lines = text.split('\n');
            let currentY = y;
            
            for (let i = 0; i < lines.length; i++) {
                let words = lines[i].split(' ');
                let line = '';
                
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = ctx.measureText(testLine);
                    let testWidth = metrics.width;
                    if (testWidth > maxWidth && n > 0) {
                        ctx.fillText(line, x, currentY);
                        line = words[n] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, currentY);
                currentY += lineHeight;
            }
        }

        // 3. محرك رسم البطاقة المزخرفة المطور
        function drawEidCard() {
            const name = document.getElementById('cardName').value.trim() || 'محبكم';
            const templateType = document.getElementById('textTemplateSelect').value;
            const style = document.getElementById('cardStyle').value;
            
            let message = "";
            // جلب نصوص القوالب الجاهزة
            if (templateType === 'warm') {
                message = "الأهل والأقارب الغاليين على القلب،\nبأجمل عبارات المحبة وأصدق الدعوات، أهنئكم بحلول عيد الأضحى المبارك. أدام الله عليكم البهجة، وتقبل منكم الطاعات، وجعل أيامكم مسرات وصحة.";
            } else if (templateType === 'friendly') {
                message = "لـ أحلى وأغلى أصدقاء بالدنيا!\nعيد أضحى مبارك وفرحة تملأ قلوبكم البيضاء. بتمنالكم عيد فخم متلكم، تقضوه مع أحبابكم بكل رواق وانبساط، وما تنسونا من حصتنا من اللحمة! 😂";
            } else if (templateType === 'business') {
                message = "عميلنا العزيز،\nبمناسبة حلول عيد الأضحى المبارك، نتقدم لكم بأسمى آيات التهاني وأطيب التبريكات. نسأل الله أن يعيده علينا وعليكم بالخير واليمن والبركات، شاكرين لكم ثقتكم الغالية بنا دائماً.";
            } else if (templateType === 'custom') {
                message = document.getElementById('customText').value.trim() || "عيدكم مبارك وسعيد، وكل عام وأنتم بألف خير!";
            }

            const canvas = document.getElementById('cardCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- بناء الخلفيات والزخارف حسب الستايل ---
            if (style === 'royal-dark') {
                let grad = ctx.createRadialGradient(400, 400, 100, 400, 400, 600);
                grad.addColorStop(0, '#111827'); grad.addColorStop(1, '#030712');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4; ctx.strokeRect(40, 40, 720, 720);
                ctx.strokeStyle = '#b59410'; ctx.lineWidth = 1; ctx.strokeRect(52, 52, 696, 696);

                ctx.fillStyle = 'rgba(255, 215, 0, 0.15)'; ctx.font = '70px Cairo';
                ctx.fillText('🕌', 70, 130); ctx.fillText('🌙', 660, 130);
                
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 50px "Reem Kufi", sans-serif';
                ctx.textAlign = 'center'; ctx.fillText('عِيد أضْحَى مُبَارَك', 400, 250);

            } else if (style === 'emerald-gold') {
                let grad = ctx.createLinearGradient(0, 0, 0, 800);
                grad.addColorStop(0, '#064e3b'); grad.addColorStop(1, '#022c22');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 4; ctx.strokeRect(40, 40, 720, 720);
                
                ctx.fillStyle = 'rgba(245, 158, 11, 0.1)'; ctx.font = '80px Cairo';
                ctx.textAlign = 'center'; ctx.fillText('✨   ✨', 400, 140);

                ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 50px "Reem Kufi", sans-serif';
                ctx.textAlign = 'center'; ctx.fillText('عَسَاكُم مِنْ عُوَّادَه', 400, 250);

            } else if (style === 'modern-tech') {
                let grad = ctx.createLinearGradient(0, 0, 800, 800);
                grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e1b4b');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#00adb5'; ctx.lineWidth = 5; ctx.strokeRect(40, 40, 720, 720);

                ctx.fillStyle = 'rgba(0, 173, 181, 0.08)'; ctx.font = '130px Cairo';
                ctx.textAlign = 'center'; ctx.fillText('🐑', 400, 200);

                ctx.fillStyle = '#00adb5'; ctx.font = 'bold 52px "Cairo", sans-serif';
                ctx.textAlign = 'center'; ctx.fillText('أضحى مبارك سعيد', 400, 300);
            }

            // --- طباعة نص التهنئة بمنتصف الكرت ---
            ctx.fillStyle = (style === 'modern-tech') ? '#cbd5e1' : '#f3f4f6';
            ctx.font = '28px "Tajawal", "Cairo", sans-serif';
            ctx.textAlign = 'center';
            // استدعاء دالة توزيع الأسطر بذكاء ومقاس عرض أقصى 600 بكسل وبأبعاد سطرية 45 بكسل
            let textYStart = (style === 'modern-tech') ? 390 : 360;
            wrapText(ctx, message, 400, textYStart, 600, 45);

            // --- قسم طباعة اسم المرسل الثابت والمزخرف بالأسفل ---
            ctx.fillStyle = (style === 'royal-dark') ? '#ffd700' : (style === 'emerald-gold' ? '#f59e0b' : '#00adb5');
            ctx.font = 'bold 22px "Cairo", sans-serif';
            ctx.fillText('✍️ مـن ومـحـبـكـم:', 400, 575);

            // لوحة الاسم بالأسفل
            ctx.fillStyle = (style === 'royal-dark') ? '#b59410' : (style === 'emerald-gold' ? '#047857' : '#1e293b');
            ctx.fillRect(150, 605, 500, 65);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(150, 605, 500, 65);

            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 32px "Cairo", sans-serif';
            ctx.fillText(name, 400, 650);

            // وسم الهوية غير المزعج
            ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.font = '15px "Cairo"';
            ctx.fillText('تم التوليد عبر منصة Maged Tech Tools', 400, 735);

            // تحويل لوحة الرسم إلى صورة حقيقية وعرضها للزائر
            const dataURL = canvas.toDataURL('image/png');
            const finalImg = document.getElementById('finalCardImg');
            finalImg.src = dataURL;
            
            // ربط زر التحميل والمشاركة
            document.getElementById('downloadLink').href = dataURL;
            const waText = encodeURIComponent(`أرسل لك بطاقة معايدة مخصصة وفخمة باسمي بمناسبة عيد الأضحى المبارك 🐑 صمم بطاقتك وصورتك الخاصة مجاناً وبثوانٍ عبر مخبر ماجد تك: ${window.location.href}`);
            document.getElementById('whatsappLink').href = `https://api.whatsapp.com/send?text=${waText}`;

            // فتح لوحة استعراض النتائج
            document.getElementById('previewBox').style.display = 'block';
            document.getElementById('previewBox').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
