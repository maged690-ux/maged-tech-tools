<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبر ماجد تك | مصنع المعايدات التفاعلية 🎆</title>
    
    <meta property="og:title" content="✨ بطاقة تهنئة خاصة من ماجد تك" />
    <meta property="og:description" content="اضغط هنا لفتح مفاجأة العيد التفاعلية 🎆" />
    <meta property="og:image" content="https://maged115599.github.io/eid_preview.jpg" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #00adb5; --eid-gold: #ffd700; --bg-dark: #0f172a; --card-bg: #1e293b; }
        body { background-color: var(--bg-dark); color: #f8fafc; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        .eid-decor { position: fixed; top: -50px; font-size: 1.8rem; z-index: 1; animation: fall linear infinite; opacity: 0.12; pointer-events: none; user-select: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        header { text-align: center; padding: 40px 20px 10px 20px; position: relative; z-index: 10; }
        header h1 { font-size: 2.4rem; margin: 0; color: var(--primary-color); }
        .workspace-section { max-width: 600px; margin: 25px auto; padding: 25px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; z-index: 10; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--primary-color); font-weight: bold; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        .generate-btn { width: 100%; background: linear-gradient(45deg, #f59e0b, #d97706); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn { padding: 11px 22px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: white; cursor: pointer; border: none; font-family: 'Cairo'; font-size: 0.95rem; }
        .btn-share-wa { background: #25d366; width: 100%; margin-top: 15px; }
        .btn-back { background: #475569; width: 100%; margin-top: 10px; }
        
        #liveViewOverlay { display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: #020617; z-index: 1000; justify-content: center; align-items: center; overflow: hidden; }
        #fireworksCanvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 1001; }
        .envelope { width: 320px; height: 220px; background: #b91c1c; border-radius: 10px; display: flex; justify-content: center; align-items: center; flex-direction: column; cursor: pointer; border: 3px solid var(--eid-gold); position: relative; z-index: 1002; transition: 0.5s; animation: pulse 2s infinite; text-align: center; padding: 10px; box-sizing: border-box; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        #actualLiveCard { display: none; max-width: 90%; width: 450px; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; z-index: 1003; animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; box-sizing: border-box; }
        @keyframes slideUp { from { transform: translateY(100vh) scale(0.6); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="normalPage">
        <div id="eid-decor-container"></div>
        <header>
            <h1>مخبر ماجد تك <span style="color: var(--eid-gold);">|</span> Lab</h1>
            <p style="color: #94a3b8; font-size: 1rem; margin-top: 8px;">بيئة اختبار وتطوير أدوات العيد التفاعلية الحية 🕋</p>
        </header>

        <div class="workspace-section">
            <h3 style="color: var(--eid-gold); text-align: center; margin-top: 0; font-family: 'Reem Kufi', sans-serif; font-size: 1.6rem;">🕋 مـصـنـع الـبـطـاقـات الـروحـانـيَّـة</h3>
            
            <div class="input-group">
                <label>اسمك الشخصي لتوقيع البطاقة:</label>
                <input type="text" id="cardName" placeholder="مثال: ماجد العلي / ماجد تك">
            </div>
            
            <div class="input-group">
                <label>اختر نص ومضمون التهنئة الحية:</label>
                <select id="textTemplateSelect" onchange="toggleCustomTextarea()">
                    <option value="warm">❤️ تهنئة عائلية دافئة وقريبة للقلب (للأهل والأقارب)</option>
                    <option value="friendly">🎉 تهنئة شبابية ممتعة ومرحة (للأصدقاء والجروبات)</option>
                    <option value="business">👔 تهنئة مهنية رسمية راقية (للزبائن والعمل)</option>
                    <option value="custom">✍️ [نص مخصص كلياً] اكتب رسالتك بنفسك بالأسفل</option>
                </select>
            </div>
            
            <div class="input-group" id="customTextContainer" style="display: none;">
                <textarea id="customText" rows="3" placeholder="اكتب هنا ما تود صياغته..."></textarea>
            </div>

            <div class="input-group">
                <label>اختر مظهر وخلفية العيد:</label>
                <select id="cardStyle">
                    <option value="royal-dark">👑 فخامة ملكية (ليلي أسود ملكي مع زخارف ذهبية)</option>
                    <option value="emerald-gold">🟢 الزمرد الأخضر (أجواء عريقة تقليدية)</option>
                    <option value="modern-tech">⚡ تيل تقني معتق (ألوان ماجد تك)</option>
                </select>
            </div>

            <button class="generate-btn" onclick="buildAndGenerate()">توليد المعايدة الفاخرة</button>

            <div id="previewBox" style="display:none; text-align:center; margin-top:20px; border-top: 2px dashed #334155; padding-top: 20px;">
                <h4 style="color: var(--primary-color); margin-bottom: 15px;">تمت المعالجة بنجاح!</h4>
                <a id="whatsappLink" class="btn btn-share-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> إرسال الرابط الحي للواتساب 📲</a>
                <a href="index.html" class="btn btn-back"><i class="fa-solid fa-house"></i> العودة للرئيسية</a>
            </div>
        </div>
    </div>

    <div id="liveViewOverlay">
        <canvas id="fireworksCanvas"></canvas>
        <audio id="eidTakbeeratAudio" src="eid_song.mpeg" preload="auto" loop></audio>
        
        <div class="envelope" id="clickableEnvelope" onclick="openLiveEnvelope()">
            <div style="font-size: 3.5rem;">✉️</div>
            <h2 style="margin: 10px 0 5px 0; font-family: 'Reem Kufi'; color: var(--eid-gold); font-size: 1.4rem;">لديك بطاقة تهنئة خاصة</h2>
            <p style="margin: 0; font-size: 0.85rem; opacity: 0.8;">اضغط هنا لفتح المفاجأة 🎆</p>
        </div>

        <div id="actualLiveCard">
            <h2 id="liveCardTitle" style="font-family: 'Reem Kufi'; font-size: 2rem; margin-top: 0;"></h2>
            <p id="liveCardMsg" style="font-size: 1.1rem; line-height: 1.7; font-family: 'Tajawal'; color: #e2e8f0; white-space: pre-line;"></p>
            <div style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px;">
                <p style="margin: 0; font-size: 0.85rem; color: var(--eid-gold);">✍️ من ومحبكم وعايدكم:</p>
                <h3 id="liveCardSender" style="margin: 5px 0 0 0; font-size: 1.4rem; color: #fff;"></h3>
            </div>
            <button class="btn" style="margin-top:20px; background: #3b82f6; width: 100%;" onclick="goToCreationPage()">🎨 اصنع بطاقة متحركة باسمك أنت مجاناً</button>
        </div>
    </div>

    <script>
        function toggleCustomTextarea() {
            document.getElementById('customTextContainer').style.display = (document.getElementById('textTemplateSelect').value === 'custom') ? 'block' : 'none';
        }

        function getMessageText(type) {
            if (type === 'warm') return "الأهل والأقارب الغاليين على القلب،\nبأجمل عبارات المحبة وأصدق الدعوات، أهنئكم بحلول عيد الأضحى المبارك. أدام الله عليكم البهجة، وتقبل منكم الطاعات.";
            if (type === 'friendly') return "لـ أحلى وأغلى أصدقاء بالدنيا!\nعيد أضحى مبارك وفرحة تملأ قلوبكم البيضاء. بتمنالكم عيد فخم متلكم، وما تنسونا من حصتنا من اللحمة! 😂";
            if (type === 'business') return "عميلنا العزيز،\nبمناسبة حلول عيد الأضحى المبارك، نتقدم لكم بأسمى آيات التهاني وأطيب التبريكات. نسأل الله أن يعيده علينا وعليكم بالخير.";
            return document.getElementById('customText').value.trim() || "عيدكم مبارك وسعيد، وكل عام وأنتم بألف خير!";
        }

        function buildAndGenerate() {
            const name = document.getElementById('cardName').value.trim() || 'محبكم';
            const msg = getMessageText(document.getElementById('textTemplateSelect').value);
            const style = document.getElementById('cardStyle').value;
            
            // سحر الواتساب النظيف:
            const currentUrl = window.location.href.split('?')[0]; 
            const liveLink = `${currentUrl}?view=live&name=${encodeURIComponent(name)}&style=${style}&msg=${encodeURIComponent(msg)}`;
            const waMsg = encodeURIComponent("✨ بطاقة تهنئة خاصة لك من ماجد تك! افتح الرابط لرؤية المفاجأة: \n\n👉 " + liveLink);
            
            document.getElementById('whatsappLink').href = `https://wa.me/?text=${waMsg}`;
            document.getElementById('previewBox').style.display = 'block';
        }

        function setupLiveOverlay(name, style, msg) {
            document.getElementById('normalPage').style.display = 'none';
            const overlay = document.getElementById('liveViewOverlay');
            overlay.style.display = 'flex';

            const liveCard = document.getElementById('actualLiveCard');
            document.getElementById('liveCardSender').innerText = name;
            document.getElementById('liveCardMsg').innerText = msg;

            if (style === 'royal-dark') {
                liveCard.style.background = '#030712'; liveCard.style.border = '2px solid #ffd700';
                document.getElementById('liveCardTitle').innerText = "عِيد أضْحَى مُبَارَك 🌙";
                document.getElementById('liveCardTitle').style.color = '#ffd700';
            } else if (style === 'emerald-gold') {
                liveCard.style.background = '#022c22'; liveCard.style.border = '2px solid #f59e0b';
                document.getElementById('liveCardTitle').innerText = "عَسَاكُم مِنْ عُوَّادَه 🟢";
                document.getElementById('liveCardTitle').style.color = '#f59e0b';
            } else {
                liveCard.style.background = '#1e293b'; liveCard.style.border = '2px solid #00adb5';
                document.getElementById('liveCardTitle').innerText = "أضحى مبارك سعيد ⚡";
                document.getElementById('liveCardTitle').style.color = '#00adb5';
            }

            playTakbeerat();
            document.body.addEventListener('click', playTakbeerat, { once: true });
        }

        function playTakbeerat() {
            const audio = document.getElementById('eidTakbeeratAudio');
            if (audio && audio.paused) audio.play().catch(e => console.log("بانتظار تفاعل المستخدم"));
        }

        function openLiveEnvelope() {
            document.getElementById('clickableEnvelope').style.transform = 'scale(0) rotate(180deg)';
            playTakbeerat();
            setTimeout(() => {
                document.getElementById('clickableEnvelope').style.display = 'none';
                document.getElementById('actualLiveCard').style.display = 'block';
                startFireworksLoop();
            }, 400);
        }

        function goToCreationPage() { window.location.href = window.location.pathname; }

        let fwCanvas, fwCtx, particles = [];
        let fireworksInterval;
        function startFireworksLoop() {
            fwCanvas = document.getElementById('fireworksCanvas'); fwCtx = fwCanvas.getContext('2d');
            resizeFwCanvas(); window.addEventListener('resize', resizeFwCanvas); renderFireworks();
            fireworksInterval = setInterval(() => { createFirework(Math.random() * fwCanvas.width, Math.random() * (fwCanvas.height * 0.5) + 100); }, 600);
        }
        function resizeFwCanvas() { if(fwCanvas) { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; } }
        function createFirework(x, y) {
            const colors = ['#ffd700', '#00adb5', '#ff2e63', '#25d366', '#f59e0b', '#a855f7', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 50; i++) { particles.push({ x: x, y: y, angle: Math.random() * Math.PI * 2, speed: Math.random() * 4 + 2, friction: 0.96, gravity: 0.1, alpha: 1, decay: Math.random() * 0.015 + 0.01, color: color }); }
        }
        function renderFireworks() {
            if (document.getElementById('liveViewOverlay').style.display !== 'flex') return;
            requestAnimationFrame(renderFireworks); fwCtx.fillStyle = 'rgba(2, 6, 23, 0.15)'; fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.speed *= p.friction; p.x += Math.cos(p.angle) * p.speed; p.y += Math.sin(p.angle) * p.speed + p.gravity; p.alpha -= p.decay;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                fwCtx.save(); fwCtx.globalAlpha = p.alpha; fwCtx.fillStyle = p.color; fwCtx.beginPath(); fwCtx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); fwCtx.fill(); fwCtx.restore();
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('view') === 'live') {
                const name = urlParams.get('name') || 'محبكم';
                const style = urlParams.get('style') || 'royal-dark';
                const msg = urlParams.get('msg') || 'كل عام وأنتم بخير!';
                setupLiveOverlay(name, style, msg);
            } else {
                const decorIcons = ['🐑', '🌙', '⭐', '✨'];
                const container = document.getElementById('eid-decor-container');
                for (let i = 0; i < 12; i++) {
                    const el = document.createElement('div'); el.className = 'eid-decor';
                    el.innerText = decorIcons[Math.floor(Math.random() * decorIcons.length)];
                    el.style.left = Math.random() * 100 + 'vw'; el.style.animationDuration = (Math.random() * 4 + 6) + 's';
                    container.appendChild(el);
                }
            }
        }
    </script>
</body>
</html>
