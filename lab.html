<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبر ماجد تك | بطاقات العيد 🐑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #00adb5;
            --eid-gold: #ffd700;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        /* زينة العيد المتحركة في الخلفية */
        .eid-decor {
            position: fixed;
            top: -50px;
            font-size: 1.8rem;
            z-index: 1;
            animation: fall linear infinite;
            opacity: 0.12;
            user-select: none;
            pointer-events: none;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        header {
            text-align: center;
            padding: 50px 20px 20px 20px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2.6rem;
            margin: 0;
            color: var(--primary-color);
            text-shadow: 0 0 25px rgba(0, 173, 181, 0.4);
        }

        /* حاوية الأداة */
        .workspace-section {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .workspace-section h3 {
            color: var(--eid-gold);
            text-align: center;
            margin-top: 0;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: bold;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(45deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* صندوق استعراض البطاقة الناتجة */
        .preview-box {
            display: none;
            margin-top: 30px;
            text-align: center;
            border-top: 2px dashed #334155;
            padding-top: 25px;
        }

        /* كافافس مخفي نستخدمه للرسم برمجياً وبجودة عالية */
        canvas {
            display: none;
        }

        /* الصورة المعروضة للمستخدم */
        .card-result-image {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 2px solid var(--eid-gold);
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-download {
            background: #059669;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-download:hover { background: #10b981; }

        .btn-share-wa {
            background: #25d366;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-share-wa:hover { background: #1ebd59; }
    </style>
</head>
<body>

    <div id="eid-decor-container"></div>

    <header>
        <h1>مخبر ماجد تك <span style="color: var(--eid-gold);">|</span> Lab</h1>
        <p>مُولّد بطاقات التهنئة البصرية الرقمية المبتكرة حصرياً لمتابعينا ✨</p>
    </header>

    <div class="workspace-section">
        <h3>🎉 صمّم بطاقة معايدة فخمة باسمك</h3>
        <p style="text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;">ابتعد عن النصوص التقليدية، واصنع كرت معايدة ملون ومزخرف بلمحة عين!</p>

        <div class="input-group">
            <label><i class="fa-solid fa-signature"></i> اكتب الاسم المراد طباعته على البطاقة:</label>
            <input type="text" id="cardName" placeholder="مثال: ماجد العلي / عائلة أبو محمد / ماجد تك">
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-palette"></i> اختر نمط ولون التصميم الزخرفي:</label>
            <select id="cardStyle">
                <option value="royal-dark">فخامة ملكية (ليلي مع زخارف ذهبية خرافية) 🌙</option>
                <option value="modern-tech">تيل تقني معتق (طابع Maged Tech مع ألوان زاهية) ⚡</option>
            </select>
        </div>

        <button class="generate-btn" onclick="drawEidCard()"><i class="fa-solid fa-wand-magic-sparkles"></i> ابتكار وتوليد البطاقة المرئية</button>

        <div class="preview-box" id="previewBox">
            <h4 style="color: var(--primary-color); margin-bottom: 15px;"><i class="fa-solid fa-image"></i> بطاقتك جاهزة ومزخرفة بنجاح:</h4>
            
            <img id="finalCardImg" class="card-result-image" alt="بطاقة عايدة ماجد تك">
            
            <div class="action-btns">
                <a id="downloadLink" class="btn-download" download="Eid_Mubarak_MagedTech.png"><i class="fa-solid fa-download"></i> حفظ الصورة بجهازك</a>
                <a id="whatsappLink" class="btn-share-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> إرسال واتساب</a>
            </div>
        </div>
    </div>

    <canvas id="cardCanvas" width="800" height="800"></canvas>

    <script>
        // 1. حركة زينة العيد بالخلفية
        const icons = ['🐑', '🌙', '⭐', '✨'];
        const decorContainer = document.getElementById('eid-decor-container');
        for (let i = 0; i < 15; i++) {
            const element = document.createElement('div');
            element.className = 'eid-decor';
            element.innerText = icons[Math.floor(Math.random() * icons.length)];
            element.style.left = Math.random() * 100 + 'vw';
            element.style.animationDuration = (Math.random() * 5 + 6) + 's';
            element.style.animationDelay = (Math.random() * 5) + 's';
            decorContainer.appendChild(element);
        }

        // 2. محرك رسم البطاقة المزخرفة ديناميكياً
        function drawEidCard() {
            const name = document.getElementById('cardName').value.trim() || 'محبكم';
            const style = document.getElementById('cardStyle').value;
            
            const canvas = document.getElementById('cardCanvas');
            const ctx = canvas.getContext('2d');
            
            // تنظيف الكانفاس قبل كل رسم جديد
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // تحديد نظام الألوان والستايلات بناء على اختيار المستخدم
            if (style === 'royal-dark') {
                // خلفية ليلية فخمة جداً متدرجة
                let grad = ctx.createRadialGradient(400, 400, 100, 400, 400, 600);
                grad.addColorStop(0, '#111827');
                grad.addColorStop(1, '#030712');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // إطار زخرفي ذهبي داخلي مزدوج
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.strokeRect(40, 40, 720, 720);
                ctx.strokeStyle = '#b59410';
                ctx.lineWidth = 1;
                ctx.strokeRect(50, 50, 700, 700);

                // رسم رموز إسلامية وزخارف زوايا
                ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
                ctx.font = '70px Cairo';
                ctx.fillText('🕌', 70, 130);
                ctx.fillText('🌙', 660, 130);
                
                // النصوص الفخمة والخطوط اليدوية الكوفية
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 52px "Reem Kufi", "Cairo", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('عِيد أضْحَى مُبَارَك', 400, 260);

                ctx.fillStyle = '#f3f4f6';
                ctx.font = '28px "Cairo", sans-serif';
                ctx.fillText('تقبل الله منا ومنكم صالح الأعمال، وأعاده الله', 400, 360);
                ctx.fillText('عليكم وعلينا بالخير والبركات والمسرات.', 400, 410);

            } else {
                // ستايل مودرن وتك ملون وجريء
                let grad = ctx.createLinearGradient(0, 0, 800, 800);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(0.5, '#1e1b4b');
                grad.addColorStop(1, '#0f172a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#00adb5';
                ctx.lineWidth = 5;
                ctx.strokeRect(40, 40, 720, 720);

                ctx.fillStyle = 'rgba(0, 173, 181, 0.1)';
                ctx.font = '120px Cairo';
                ctx.fillText('🐑', 400, 200);

                ctx.fillStyle = '#00adb5';
                ctx.font = 'bold 55px "Cairo", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('أضحى مبارك سعيد', 400, 320);

                ctx.fillStyle = '#94a3b8';
                ctx.font = '30px "Cairo", sans-serif';
                ctx.fillText('بكل الحب والتهاني نبارك لكم قدوم العيد', 400, 420);
            }

            // --- قسم طباعة اسم المرسل الثابت والمزخرف بالأسفل ---
            ctx.fillStyle = style === 'royal-dark' ? '#ffd700' : '#00adb5';
            ctx.font = 'bold 22px "Cairo", sans-serif';
            ctx.fillText('✍️ منبـع الـمـعـايـدة ومـحـبـكـم:', 400, 560);

            // طباعة اسم الشخص داخل لوحة بيضاء أنيقة متوهجة بالمنتصف
            ctx.fillStyle = style === 'royal-dark' ? '#b59410' : '#1e293b';
            ctx.fillRect(150, 590, 500, 70);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(150, 590, 500, 70);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 34px "Cairo", sans-serif';
            ctx.fillText(name, 400, 638);

            // إضافة توقيع وهوية صفحة ماجد كـ العلامة المائية غير المزعجة للحفظ
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '16px "Cairo"';
            ctx.fillText('تم التوليد عبر منصة Maged Tech Tools', 400, 720);

            // تحويل الكانفاس المشغول إلى رابط صورة حقيقية (DataURL)
            const dataURL = canvas.toDataURL('image/png');
            
            // حقن الصورة في الواجهة وعرضها للمستخدم
            const finalImg = document.getElementById('finalCardImg');
            finalImg.src = dataURL;
            
            // تجهيز روابط التنزيل والمشاركة
            document.getElementById('downloadLink').href = dataURL;
            
            const waText = encodeURIComponent(`مرحباً! أرسل لك بطاقة معايدة خاصة بمناسبة عيد الأضحى المبارك 🎉 تصميماً مميزاً باسمي. يمكنك رؤية بطاقتك أو صنع بطاقة مخصصة لك مجاناً عبر مخبر ماجد تك: ${window.location.href}`);
            document.getElementById('whatsappLink').href = `https://api.whatsapp.com/send?text=${waText}`;

            // إظهار صندوق المعاينة بسلاسة
            document.getElementById('previewBox').style.display = 'block';
        }
    </script>
</body>
</html>
