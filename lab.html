<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخبر ماجد تك | مصنع المعايدات التفاعلية 🎆</title>
    <meta property="og:title" content="✨ بطاقة تهنئة خاصة من ماجد تك" />
    <meta property="og:description" content="اضغط هنا لفتح مفاجأة العيد التفاعلية 🎆" />
    <meta property="og:image" content="https://maged115599.github.io/eid_preview.jpg" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@500;700&display=swap" display="swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #00adb5; --eid-gold: #ffd700; --bg-dark: #0f172a; --card-bg: #1e293b; }
        body { background-color: var(--bg-dark); color: #f8fafc; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        .eid-decor { position: fixed; top: -50px; font-size: 1.8rem; z-index: 1; animation: fall linear infinite; opacity: 0.12; pointer-events: none; user-select: none; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        header { text-align: center; padding: 40px 20px 10px 20px; position: relative; z-index: 10; }
        header h1 { font-size: 2.4rem; margin: 0; color: var(--primary-color); }
        .workspace-section { max-width: 600px; margin: 25px auto; padding: 25px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; z-index: 10; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--primary-color); font-weight: bold; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        .generate-btn { width: 100%; background: linear-gradient(45deg, #f59e0b, #d97706); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn { padding: 11px 22px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; color: white; cursor: pointer; border: none; }
        .btn-share-wa { background: #25d366; }
        #liveViewOverlay { display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; background: #020617; z-index: 1000; justify-content: center; align-items: center; overflow: hidden; }
        #fireworksCanvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 1001; }
        .envelope { width: 320px; height: 220px; background: #b91c1c; border-radius: 10px; display: flex; justify-content: center; align-items: center; flex-direction: column; cursor: pointer; border: 3px solid var(--eid-gold); z-index: 1002; transition: 0.5s; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        #actualLiveCard { display: none; max-width: 90%; width: 450px; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; z-index: 1003; animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slideUp { from { transform: translateY(100vh) scale(0.6); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="normalPage">
        <div id="eid-decor-container"></div>
        <header><h1>مخبر ماجد تك <span style="color: var(--eid-gold);">|</span> Lab</h1></header>
        <div class="workspace-section">
            <div class="input-group">
                <label>اسمك لتوقيع البطاقة:</label>
                <input type="text" id="cardName" placeholder="مثال: ماجد تك">
            </div>
            <div class="input-group">
                <label>اختر التهنئة:</label>
                <select id="textTemplateSelect" onchange="toggleCustomTextarea()">
                    <option value="warm">❤️ تهنئة عائلية</option>
                    <option value="friendly">🎉 تهنئة شبابية</option>
                    <option value="business">👔 تهنئة مهنية</option>
                    <option value="custom">✍️ نص مخصص</option>
                </select>
            </div>
            <div class="input-group" id="customTextContainer" style="display: none;">
                <textarea id="customText" rows="3" placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <button class="generate-btn" onclick="buildAndGenerate()">توليد المعايدة الفاخرة</button>
            <div id="previewBox" style="display:none; text-align:center; margin-top:20px;">
                <a id="whatsappLink" class="btn btn-share-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> إرسال الرابط للواتساب</a>
            </div>
        </div>
    </div>
    <div id="liveViewOverlay">
        <canvas id="fireworksCanvas"></canvas>
        <audio id="eidTakbeeratAudio" src="takbeerat.mp3" preload="auto" loop></audio>
        <div class="envelope" id="clickableEnvelope" onclick="openLiveEnvelope()"><h2>اضغط لفتح البطاقة ✉️</h2></div>
        <div id="actualLiveCard"></div>
    </div>
    <script>
        function toggleCustomTextarea() { document.getElementById('customTextContainer').style.display = (document.getElementById('textTemplateSelect').value === 'custom') ? 'block' : 'none'; }
        function getMessageText(type) {
            if (type === 'warm') return "الأهل والأقارب الغاليين على القلب،\nبأجمل عبارات المحبة وأصدق الدعوات، أهنئكم بحلول عيد الأضحى المبارك. أدام الله عليكم البهجة.";
            if (type === 'friendly') return "لـ أحلى وأغلى أصدقاء بالدنيا!\nعيد أضحى مبارك وفرحة تملأ قلوبكم البيضاء. وما تنسونا من حصتنا من اللحمة! 😂";
            if (type === 'business') return "عميلنا العزيز،\nبمناسبة حلول عيد الأضحى المبارك، نتقدم لكم بأسمى آيات التهاني وأطيب التبريكات.";
            return document.getElementById('customText').value || "عيدكم مبارك.";
        }
        function buildAndGenerate() {
            const name = document.getElementById('cardName').value || 'محبكم';
            const msg = getMessageText(document.getElementById('textTemplateSelect').value);
            const currentUrl = window.location.href.split('?')[0]; 
            const liveLink = `${currentUrl}?view=live&name=${encodeURIComponent(name)}&msg=${encodeURIComponent(msg)}`;
            const waMsg = encodeURIComponent("✨ بطاقة تهنئة خاصة من ماجد تك! افتح الرابط لرؤية المفاجأة: \n\n" + liveLink);
            document.getElementById('whatsappLink').href = `https://wa.me/?text=${waMsg}`;
            document.getElementById('previewBox').style.display = 'block';
        }
        function openLiveEnvelope() {
            document.getElementById('clickableEnvelope').style.display = 'none';
            document.getElementById('actualLiveCard').style.display = 'block';
        }
        // [ضع هنا بقية دوال الألعاب النارية التي كانت عندك في الكود الأصلي]
    </script>
</body>
</html>
